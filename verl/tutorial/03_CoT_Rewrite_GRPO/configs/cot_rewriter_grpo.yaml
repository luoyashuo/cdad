# CoT Rewriter GRPO 训练配置
# 使用方法: python scripts/train.py --config-name=cot_rewriter_grpo

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ 实验配置 ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen7b_lora_4xA100
  total_epochs: 3
  total_training_steps: null  # 如果设置则覆盖 total_epochs
  save_freq: 100
  val_freq: 50
  device: cuda
  log_freq: 10

# ============ 数据配置 ============
data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  train_batch_size: 64
  val_batch_size: 32
  gen_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 2048
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model  # non_tensor_batch 中包含 ground_truth 的字段

# ============ Actor/Rollout/Ref 混合引擎配置 ============
actor_rollout_ref:
  hybrid_engine: true  # 必须为 true

  # 模型配置
  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    dtype: bfloat16
    # LoRA 配置 (强烈推荐)
    lora:
      rank: 64
      alpha: 128
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
      dropout: 0.05

  # Actor 训练配置
  actor:
    ppo_epochs: 1  # GRPO 通常 1 个 epoch 即可
    clip_ratio: 0.2
    entropy_coeff: 0.01
    gradient_checkpointing: true
    grad_clip: 1.0

    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: null  # 自动从 trainer 获取

  # Rollout 推理配置
  rollout:
    name: sglang  # 或 vllm
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.35
    mem_fraction_static: 0.8
    # 生成配置
    n: 8  # 每个 prompt 生成 8 个响应 (GRPO 需要多个样本)
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 2048

  # Reference Policy 配置
  ref:
    # 使用 LoRA 时自动使用 Actor 的基座作为 Ref，无需额外配置
    enable: false

# ============ 算法配置 ============
algorithm:
  adv_estimator: grpo  # 使用 GRPO 优势估计
  norm_adv_by_std_in_grpo: true  # 标准化优势 (原始 GRPO)
  gamma: 1.0
  lam: 1.0  # GRPO 不使用
  use_kl_in_reward: false  # GRPO 通常不需要 KL 惩罚

# ============ Critic 配置 (GRPO 不需要) ============
critic:
  enable: false

# ============ 奖励模型配置 ============
reward_model:
  enable: true
  use_reward_loop: false

  # 自定义奖励函数
  custom_reward_function:
    path: src/reward/combined_reward.py
    name: compute_cot_rewriter_reward
    reward_kwargs:
      student_model_path: ./models/Qwen2.5-3B-Instruct
      lambda_logic: 0.5
      use_fsf_reward: true
      fsf_judge_type: api
      fsf_api_url: http://localhost:8000/v1/chat/completions

# ============ 奖励管理器配置 ============
reward_manager:
  source: register
  name: naive  # 使用 NaiveRewardManager

# ============ 资源配置 ============
# 单机 4 卡配置
trainer:
  n_gpus_per_node: 4
  nnodes: 1

# 如果使用 Megatron，取消注释以下配置
# megatron:
#   tensor_model_parallel_size: 2
#   pipeline_model_parallel_size: 1
