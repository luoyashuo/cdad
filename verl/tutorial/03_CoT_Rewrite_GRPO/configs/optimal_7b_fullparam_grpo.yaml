# =============================================================================
# 最优配置：7B 全参 GRPO + 1.7B 统一奖励模型
# =============================================================================
# 硬件要求：4×A100-80G, CPU 内存 256GB
# 序列长度：输入 4000 + 输出 4000 = 8000 tokens
# 显存估算：~173 GB / 320 GB (54% 利用率)
# =============================================================================

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# =============================================================================
#                              实验配置
# =============================================================================
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: 7b_fullparam_unified_reward
  total_epochs: 3
  total_training_steps: null
  save_freq: 100
  val_freq: 50
  log_freq: 10
  device: cuda

  # 资源配置
  n_gpus_per_node: 4
  nnodes: 1

# =============================================================================
#                              数据配置
# =============================================================================
data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet

  # Batch 配置
  train_batch_size: 8             # 每 step 8 个 prompt
  val_batch_size: 16
  gen_batch_size: 8

  # 序列长度 (总计 8000 tokens)
  max_prompt_length: 4000
  max_response_length: 4000

  # 数据加载
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model

  # 序列长度平衡 (优化显存利用)
  use_seqlen_balancing: true

# =============================================================================
#                      Actor/Rollout 混合引擎配置
# =============================================================================
actor_rollout_ref:
  hybrid_engine: true             # 必须为 true，共享显存

  # ---------- 模型配置 (7B 全参) ----------
  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    dtype: bfloat16
    # 全参训练，不使用 LoRA

  # ---------- Actor 训练配置 ----------
  actor:
    # GRPO 参数
    ppo_epochs: 1                 # GRPO 通常 1 epoch 即可
    clip_ratio: 0.2
    entropy_coeff: 0.01

    # 显存优化 (关键!)
    gradient_checkpointing: true  # 必须开启
    grad_clip: 1.0

    # FSDP 配置 (ZeRO-3 + CPU Offload)
    fsdp_config:
      sharding_strategy: FULL_SHARD     # 完全分片
      cpu_offload: true                 # 优化器状态卸载到 CPU
      backward_prefetch: BACKWARD_PRE   # 预取优化
      forward_prefetch: true
      limit_all_gathers: true           # 限制 all-gather 显存

      # 混合精度
      mixed_precision:
        param_dtype: bfloat16
        reduce_dtype: float32
        buffer_dtype: bfloat16

    # 优化器配置
    optim:
      lr: 5e-6                    # 全参用更小学习率
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1

  # ---------- Rollout 推理配置 ----------
  rollout:
    name: sglang                  # 推荐 SGLang
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.25  # 给 rollout 25% 显存
    mem_fraction_static: 0.8

    # GRPO 采样配置
    n: 4                          # 每 prompt 生成 4 个响应
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 4000

    # 并发控制
    max_num_seqs: 4

  # ---------- Reference Policy ----------
  ref:
    enable: false                 # 全参训练暂不使用 ref policy
    # 如需 KL 惩罚，设为 true 并配置 ref 模型路径

# =============================================================================
#                              算法配置
# =============================================================================
algorithm:
  adv_estimator: grpo             # 使用 GRPO 优势估计
  norm_adv_by_std_in_grpo: true   # 标准化优势
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false         # GRPO 通常不需要 KL 惩罚

# =============================================================================
#                       Critic 配置 (GRPO 不需要)
# =============================================================================
critic:
  enable: false

# =============================================================================
#                         统一奖励模型配置
# =============================================================================
reward_model:
  enable: true
  use_reward_loop: false

  # 使用统一奖励模型 (1.7B 同时计算 R_cog 和 R_logic)
  custom_reward_function:
    path: src/reward/unified_reward_model.py
    name: compute_unified_reward
    reward_kwargs:
      reward_model_path: ./models/Qwen2.5-1.7B-Instruct
      lambda_logic: 0.5           # 逻辑奖励权重
      use_logic_reward: true      # 启用逻辑奖励

reward_manager:
  source: register
  name: naive

