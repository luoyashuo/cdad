# 8B 全参数 GRPO 训练 - 2 × A100-80G 8-bit 优化器配置
#
# 使用 bitsandbytes 8-bit Adam，优化器显存减少 75%
#
# 显存估算 (per GPU, TP=2):
#   模型: 16GB/2 = 8GB
#   梯度: 16GB/2 = 8GB
#   优化器 (8-bit): 64GB/4/2 = 8GB  (原来 32GB/卡)
#   激活: ~10GB
#   KV Cache: ~12GB (n=2)
#   总计: ~46GB ✅
#
# 优点：比 ZeRO-3 + Offload 快很多
# 缺点：需要安装 bitsandbytes，精度略有损失

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: cot_rewriter_grpo
  experiment_name: 8b_fullparam_8k_2xA100_80G_8bit
  total_epochs: 3
  save_freq: 50
  val_freq: 50
  device: cuda
  log_freq: 10

data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  train_batch_size: 16
  val_batch_size: 8
  gen_batch_size: 16
  max_prompt_length: 2048
  max_response_length: 6144
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model

actor_rollout_ref:
  hybrid_engine: true

  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    dtype: bfloat16

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    gradient_checkpointing: true
    grad_clip: 1.0
    gradient_accumulation_steps: 2

    optim:
      # 使用 8-bit Adam
      name: adamw_bnb_8bit    # bitsandbytes 8-bit
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.05
      min_lr_ratio: 0.1

  rollout:
    name: vllm
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.3
    mem_fraction_static: 0.7
    n: 2
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 6144

  ref:
    enable: false

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

critic:
  enable: false

reward_model:
  enable: true
  use_reward_loop: false
  custom_reward_function:
    path: src/reward/vllm_student_reward.py
    name: compute_vllm_student_reward
    reward_kwargs:
      vllm_base_url: http://localhost:8100/v1
      lambda_logic: 0.0
      use_logic_reward: false

reward_manager:
  source: register
  name: naive

trainer:
  n_gpus_per_node: 2
  nnodes: 1

# ZeRO-2 足够（8-bit优化器已经很省）
deepspeed:
  stage: 2
  overlap_comm: true
  contiguous_gradients: true
