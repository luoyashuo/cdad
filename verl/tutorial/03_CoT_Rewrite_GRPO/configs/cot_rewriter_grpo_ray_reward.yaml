# CoT Rewriter GRPO 训练配置 (使用独立 GPU 的 Student Reward Model)
#
# 架构：
#   GPU 0-2: Policy Model (7B LoRA) + vLLM/SGLang Rollout
#   GPU 3:   Student Reward Model (3B + FSF LoRA)
#
# 优势：
#   1. Rollout 和 Reward 计算完全隔离，无显存竞争
#   2. 可并行执行 Rollout 和 Reward 计算
#   3. 更稳定，不会因为显存峰值导致 OOM
#
# 使用方法: python scripts/train.py --config-name=cot_rewriter_grpo_ray_reward

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ 实验配置 ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen7b_lora_ray_reward_4xA100
  total_epochs: 3
  save_freq: 100
  val_freq: 50
  device: cuda
  log_freq: 10

# ============ 数据配置 ============
data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  train_batch_size: 64
  val_batch_size: 32
  gen_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 2048
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model

# ============ Actor/Rollout 配置 (GPU 0-2) ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    dtype: bfloat16
    lora:
      rank: 64
      alpha: 128
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
      dropout: 0.05

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    gradient_checkpointing: true
    grad_clip: 1.0

    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1

  rollout:
    name: sglang
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5  # 提高利用率，因为不需要给 Reward Model 留空间
    mem_fraction_static: 0.8
    n: 8
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 2048

  ref:
    enable: false

# ============ 算法配置 ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

# ============ Critic 配置 ============
critic:
  enable: false

# ============ 奖励模型配置 (GPU 3) ============
reward_model:
  enable: true
  use_reward_loop: false

  # 重要：启用独立资源池，部署在单独的 GPU 上
  enable_resource_pool: true
  n_gpus_per_node: 1  # Reward Model 使用 1 个 GPU

  # 使用 Ray Actor 的 Student Reward
  custom_reward_function:
    path: src/reward/ray_student_reward.py
    name: compute_ray_student_reward
    reward_kwargs:
      # Student Model 路径
      student_model_path: ./models/Qwen2.5-3B-Instruct
      # FSF LoRA adapter 路径
      fsf_lora_path: ./outputs/fsf_lora
      # 逻辑奖励权重
      lambda_logic: 0.5
      # 是否使用逻辑奖励
      use_logic_reward: true

# ============ 奖励管理器配置 ============
reward_manager:
  source: register
  name: naive

# ============ 资源配置 ============
trainer:
  n_gpus_per_node: 4  # 总共 4 张 GPU
  nnodes: 1

# 资源池映射：
# - GPU 0-2: Actor + Rollout (3 GPUs)
# - GPU 3: Reward Model (1 GPU)
