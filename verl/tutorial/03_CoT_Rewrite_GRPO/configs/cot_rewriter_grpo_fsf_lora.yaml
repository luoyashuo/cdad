# CoT Rewriter GRPO 训练配置 (使用 FSF LoRA)
#
# 与 cot_rewriter_grpo.yaml 的区别:
# - 使用 FSF LoRA 奖励模型，无需额外部署 FSF Judge 服务
# - Student Model 基座同时用于:
#   1. 认知奖励计算 (不带 adapter)
#   2. FSF 分析 (带 FSF LoRA adapter)
#
# 使用方法: python scripts/train.py --config-name=cot_rewriter_grpo_fsf_lora

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ 实验配置 ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen7b_lora_fsf_lora_4xA100
  total_epochs: 3
  total_training_steps: null
  save_freq: 100
  val_freq: 50
  device: cuda
  log_freq: 10

# ============ 数据配置 ============
data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  train_batch_size: 64
  val_batch_size: 32
  gen_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 2048
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model

# ============ Actor/Rollout/Ref 混合引擎配置 ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    dtype: bfloat16
    lora:
      rank: 64
      alpha: 128
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
      dropout: 0.05

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    gradient_checkpointing: true
    grad_clip: 1.0

    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: null

  rollout:
    name: sglang
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.35
    mem_fraction_static: 0.8
    n: 8
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 2048

  ref:
    enable: false

# ============ 算法配置 ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

# ============ Critic 配置 (GRPO 不需要) ============
critic:
  enable: false

# ============ 奖励模型配置 (FSF LoRA) ============
reward_model:
  enable: true
  use_reward_loop: false

  # 使用 FSF LoRA 奖励函数
  custom_reward_function:
    path: src/reward/fsf_lora_reward.py
    name: compute_fsf_lora_reward
    reward_kwargs:
      # Student Model 路径（同时作为基座和 FSF LoRA 的基座）
      student_model_path: ./models/Qwen2.5-3B-Instruct
      # FSF LoRA adapter 路径（需要先用 train_fsf_lora.py 训练）
      fsf_lora_path: ./outputs/fsf_lora
      # 逻辑奖励权重
      lambda_logic: 0.5
      # 是否使用逻辑奖励
      use_logic_reward: true

# ============ 奖励管理器配置 ============
reward_manager:
  source: register
  name: naive

# ============ 资源配置 ============
trainer:
  n_gpus_per_node: 4
  nnodes: 1
