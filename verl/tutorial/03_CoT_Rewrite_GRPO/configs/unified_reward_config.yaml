# 使用统一奖励模型的配置
# 将 Student Model 和 FSF Analyzer 合并为一个模型

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: cot_rewriter_grpo
  experiment_name: unified_reward_model
  total_epochs: 3

data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  train_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 2048
  return_raw_chat: true

actor_rollout_ref:
  hybrid_engine: true

  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    lora:
      rank: 64
      alpha: 128
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

  actor:
    ppo_epochs: 1
    gradient_checkpointing: true
    optim:
      lr: 1e-5

  rollout:
    name: sglang
    n: 8
    temperature: 0.7
    gpu_memory_utilization: 0.35

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true

critic:
  enable: false

# ============ 关键配置：使用统一奖励模型 ============
reward_model:
  enable: true
  use_reward_loop: false

  custom_reward_function:
    # 使用统一奖励模型
    path: src/reward/unified_reward_model.py
    name: compute_unified_reward
    reward_kwargs:
      # 统一模型路径 (同时用于 R_cog 和 R_logic)
      reward_model_path: ./models/Qwen2.5-3B-Instruct
      lambda_logic: 0.5
      use_logic_reward: true
      # 可选：FSF 任务使用单独的 LoRA
      # use_lora_for_fsf: true
      # fsf_lora_path: ./models/fsf_lora_adapter
