# CoT Rewriter GRPO 训练配置 (使用 vLLM 服务的 Student Reward)
#
# 架构：
#   GPU 0-2: Policy Model (7B LoRA) + vLLM/SGLang Rollout
#   GPU 3:   Student vLLM Server (独立进程，HTTP API)
#
# 优势：
#   1. vLLM 自带 continuous batching 优化
#   2. 完全解耦，通过 HTTP 调用
#   3. 支持 LoRA 热切换
#   4. 部署简单，一条命令启动
#
# 启动顺序：
#   1. 先启动 vLLM 服务: bash scripts/start_student_vllm.sh lora
#   2. 再启动训练: python scripts/train.py --config-name=cot_rewriter_grpo_vllm_reward

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ 实验配置 ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen7b_lora_vllm_reward_4xA100
  total_epochs: 3
  save_freq: 100
  val_freq: 50
  device: cuda
  log_freq: 10

# ============ 数据配置 ============
data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  train_batch_size: 64
  val_batch_size: 32
  gen_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 2048
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model

# ============ Actor/Rollout 配置 (GPU 0-2) ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    dtype: bfloat16
    lora:
      rank: 64
      alpha: 128
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
      dropout: 0.05

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    gradient_checkpointing: true
    grad_clip: 1.0

    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1

  rollout:
    name: sglang
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    mem_fraction_static: 0.8
    n: 8
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 2048

  ref:
    enable: false

# ============ 算法配置 ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

# ============ Critic 配置 ============
critic:
  enable: false

# ============ 奖励模型配置 (vLLM 服务) ============
reward_model:
  enable: true
  use_reward_loop: false

  # 使用 vLLM 服务的 custom reward function
  custom_reward_function:
    path: src/reward/vllm_student_reward.py
    name: compute_vllm_student_reward
    reward_kwargs:
      # vLLM 服务地址
      vllm_base_url: http://localhost:8100/v1
      # 模型名称
      model_name: Qwen2.5-3B-Instruct
      # FSF LoRA adapter 名称（需要 vLLM 启用 --enable-lora）
      fsf_lora_name: fsf_lora
      # 逻辑奖励权重
      lambda_logic: 0.5
      # 是否使用逻辑奖励
      use_logic_reward: true
      # 最大并发数
      max_concurrent: 32

# ============ 奖励管理器配置 ============
reward_manager:
  source: register
  name: naive

# ============ 资源配置 ============
trainer:
  n_gpus_per_node: 3  # 训练只使用 3 张 GPU，第 4 张给 vLLM 服务
  nnodes: 1
