# 8B 全参数 GRPO 训练 - 2 × A100-80G 极限配置
#
# 关键优化：
#   1. ZeRO-3：分片模型/梯度/优化器
#   2. CPU Offload：优化器状态卸载到CPU
#   3. Gradient Checkpointing：减少激活显存
#   4. n=2：最小GRPO采样
#   5. micro_batch=1 + 梯度累积
#
# 预期速度：比LoRA慢 2-3 倍，但可以跑起来
#
# 显存估算 (per GPU):
#   模型分片: 16GB/2 = 8GB
#   梯度分片: 16GB/2 = 8GB
#   优化器: CPU Offload → 0GB GPU
#   激活: ~10GB (checkpointing)
#   KV Cache: ~10GB (n=2)
#   总计: ~36GB ✅ (有余量)

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: cot_rewriter_grpo
  experiment_name: 8b_fullparam_8k_2xA100_80G_zero3
  total_epochs: 3
  save_freq: 50
  val_freq: 50
  device: cuda
  log_freq: 10

data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  # 极小 batch，用梯度累积补偿
  train_batch_size: 8         # 全局 batch
  val_batch_size: 4
  gen_batch_size: 8
  max_prompt_length: 2048
  max_response_length: 6144   # 总计 8K
  return_raw_chat: true
  dataloader_num_workers: 2   # 减少 CPU 内存
  reward_fn_key: reward_model

actor_rollout_ref:
  hybrid_engine: true

  model:
    path: ./models/Qwen2.5-7B-Instruct
    trust_remote_code: true
    dtype: bfloat16
    # 不使用 LoRA = 全参数微调

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    gradient_checkpointing: true  # 必须开启
    grad_clip: 1.0

    # 梯度累积
    gradient_accumulation_steps: 4  # 有效 batch = 8 * 4 = 32

    optim:
      lr: 1e-5              # 全参用更小学习率
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.05
      min_lr_ratio: 0.1

  rollout:
    name: vllm
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.25   # 很低，给训练留空间
    mem_fraction_static: 0.6
    n: 2                           # 最小 GRPO 采样数
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 6144

  ref:
    # ZeRO-3 下 Ref 可以和 Actor 共享分片
    enable: false
    # 或者使用 EMA (见下方说明)

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

critic:
  enable: false

reward_model:
  enable: true
  use_reward_loop: false
  # 使用外部服务，避免占用 GPU 显存
  custom_reward_function:
    path: src/reward/vllm_student_reward.py
    name: compute_vllm_student_reward
    reward_kwargs:
      vllm_base_url: http://localhost:8100/v1
      lambda_logic: 0.0       # 关闭 FSF，简化
      use_logic_reward: false

reward_manager:
  source: register
  name: naive

trainer:
  n_gpus_per_node: 2
  nnodes: 1

# ============ 关键：DeepSpeed ZeRO-3 配置 ============
deepspeed:
  stage: 3                    # ZeRO-3：分片所有

  # CPU Offload 优化器（关键！）
  offload_optimizer:
    device: cpu
    pin_memory: true

  # 可选：也 offload 参数（更激进，更慢）
  # offload_param:
  #   device: cpu
  #   pin_memory: true

  # 通信优化
  overlap_comm: true
  contiguous_gradients: true
  reduce_scatter: true

  # 内存优化
  stage3_prefetch_bucket_size: 5e7
  stage3_param_persistence_threshold: 1e5
  stage3_max_live_parameters: 1e8
  stage3_max_reuse_distance: 1e8
