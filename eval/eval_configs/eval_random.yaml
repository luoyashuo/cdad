# EvalScope 评测配置文件 - 测试所有子集版本
# 模型路径
model_path: /mnt/moonfs/luoyashuo-m2/research/cdad/ckpt/baseline/qwen3_1_7b_base_sft_random/checkpoint-23944

# vLLM配置
vllm:
  tp: 4  # tensor parallel size
  gpu_memory_utilization: 0.9  # GPU显存利用率
  max_model_len: 32768  # vLLM启动时的最大上下文长度（prompt + completion）

# 评测并发配置
eval:
  parallel: 60  # 并发请求数，增加可提高测试速度，但需要确保服务端能承受

# 沙箱配置 - 临时文件存储路径 (避免打爆主机存储)
sandbox:
  work_dir: /mnt/moonfs/luoyashuo-m2/tmp/evalscope_sandbox

# 评测配置 - 不指定子集，测试所有默认子集
benchmarks:
  AIME24:
    dataset_name: "aime24"
    repeats: 16
    temperature: 1.0
    max_tokens: 25000
    few_shot_num: 0

  AIME25:
    dataset_name: "aime25"
    repeats: 16
    temperature: 1.0
    max_tokens: 25000
    few_shot_num: 0

  MATH500:
    dataset_name: "math_500"
    repeats: 3
    temperature: 1.0
    max_tokens: 25000
    few_shot_num: 0

  AMC24:
    dataset_name: "amc"
    subset: "amc24"  # AMC 必须指定年份作为子集
    repeats: 3
    temperature: 0.0
    max_tokens: 25000
    few_shot_num: 0

  GPQA_Diamond:
    dataset_name: "gpqa_diamond"
    repeats: 3
    temperature: 0.0
    max_tokens: 25000
    few_shot_num: 0
  
  GSM8K:
    dataset_name: "gsm8k"
    repeats: 3
    temperature: 0.0
    max_tokens: 25000
    few_shot_num: 0
