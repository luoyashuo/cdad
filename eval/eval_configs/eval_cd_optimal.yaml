# EvalScope 评测配置文件 - CD Optimal 策略
# 注意: 训练完成后需要更新 checkpoint 路径

# 模型路径 (训练完成后更新为实际的checkpoint路径)
model_path: /mnt/moonfs/luoyashuo-ksyun/research/cdad/ckpt/strategies/qwen3_1_7b_base_sft_cd_optimal

# vLLM配置
vllm:
  tp: 4  # tensor parallel size
  gpu_memory_utilization: 0.9  # GPU显存利用率
  max_model_len: 32768  # vLLM启动时的最大上下文长度（prompt + completion）

# 评测并发配置
eval:
  parallel: 60  # 并发请求数，增加可提高测试速度，但需要确保服务端能承受

# 沙箱配置 - 临时文件存储路径 (避免打爆主机存储)
sandbox:
  work_dir: /mnt/moonfs/luoyashuo-ksyun/tmp/evalscope_sandbox

# 评测配置
benchmarks:
  HumanEval:
    dataset_name: "humaneval"
    repeats: 3
    temperature: 0.0
    max_tokens: 25000
    few_shot_num: 0
    use_sandbox: false

  LiveCodeBench:
    dataset_name: "live_code_bench"
    repeats: 3
    temperature: 1.0
    max_tokens: 25000
    few_shot_num: 0
    use_sandbox: false
