# EvalScope 评测配置文件 - 测试所有子集版本
# 模型路径
# model_path: /fs/fast/u20240075/luoyashuo/checkpoints/cold_start/qwen2.5_1.5b_meta_math_40k
model_path: /fs/fast/u20240075/luoyashuo/checkpoints/vallina_sft/llama3_1b_vallina_sft_20k

# vLLM配置
vllm:
  tp: 2  # tensor parallel size
  gpu_memory_utilization: 0.9  # GPU显存利用率
  max_model_len: 16384  # vLLM启动时的最大上下文长度（prompt + completion）

# 评测并发配置
eval:
  parallel: 30  # 并发请求数，增加可提高测试速度，但需要确保服务端能承受

# 沙箱配置 - 临时文件存储路径 (避免打爆主机存储)
sandbox:
  work_dir: /fs/fast/u20240075/luoyashuo/tmp/evalscope_sandbox

# 评测配置 - 不指定子集，测试所有默认子集
benchmarks:
  # MATH
  AIME24:
    dataset_name: "aime24"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  AIME25:
    dataset_name: "aime25"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  MATH500:
    dataset_name: "math_500"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  AMC24:
    dataset_name: "amc"
    subset: "amc24"  # AMC 必须指定年份作为子集
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  GSM8K:
    dataset_name: "gsm8k"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  # Code
  HumanEval:
    dataset_name: "humaneval"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false

  LiveCodeBench:
    dataset_name: "live_code_bench"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false
  # General
  IFEval:
    dataset_name: "ifeval"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false
  TruthfulQA:
    dataset_name: "truthful_qa"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false