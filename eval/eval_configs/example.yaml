# EvalScope 评测配置文件 - 测试所有子集版本
# 模型路径
model_path: /mnt/moonfs/luoyashuo-m2/research/cdad/ckpt/baseline/qwen3_1_7b_base_sft_cg/checkpoint-23944

# vLLM配置
vllm:
  tp: 2  # tensor parallel size
  gpu_memory_utilization: 0.9  # GPU显存利用率

# 评测配置 - 不指定子集，测试所有默认子集
benchmarks:
  # AIME 2024 - 不指定子集，将默认测试所有可用子集
  # AIME24:
  #   dataset_name: "aime24"
  #   # 不指定subset，将使用默认子集（default）
  #   repeats: 1
  #   temperature: 0.0
  #   max_tokens: 8192
  #   few_shot_num: 0

  # AIME 2025 - 不指定子集，将默认测试所有可用子集（AIME2025-I 和 AIME2025-II）
  AIME25:
    dataset_name: "aime25"
    # 不指定subset，将测试 AIME2025-I 和 AIME2025-II 两个子集
    repeats: 1
    temperature: 0.0
    max_tokens: 128
    few_shot_num: 0

