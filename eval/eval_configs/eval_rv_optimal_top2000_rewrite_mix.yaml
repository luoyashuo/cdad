# EvalScope 评测配置文件 - RV Optimal 策略
# 注意: 训练完成后需要更新 checkpoint 路径

# 模型路径 (训练完成后更新为实际的checkpoint路径)
model_path: /data/luoys/checkpoints/cdad/warmup/llama3_2_1b_rv_optimal_top2000_mix/checkpoint-990
# vLLM配置
vllm:
  tp: 8  # tensor parallel size
  gpu_memory_utilization: 0.9  # GPU显存利用率
  max_model_len: 32768  # vLLM启动时的最大上下文长度（prompt + completion）

# 评测并发配置
eval:
  parallel: 45  # 并发请求数，增加可提高测试速度，但需要确保服务端能承受

# 沙箱配置 - 临时文件存储路径 (避免打爆主机存储)
sandbox:
  work_dir: /data/luoys/tmp/evalscope_sandbox

