BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
API_KEY: sk-9ae88192c0e54080831b8a7408d2da8d

# vLLM配置（离线模式，直接加载模型，无需HTTP服务）
vllm:
  tp: 1              # tensor parallel size（每个DP分片占几张GPU）
  dp: 2              # data parallel size（几个LLM实例，dp>1时用Ray）
  gpu_memory_utilization: 0.9
  max_model_len: 16384
  enforce_eager: true

# 评测配置
eval:
  batch_size: 64      # evalscope每次传给模型的batch大小

# 沙箱配置 - 临时文件存储路径 (避免打爆主机存储)
sandbox:
  work_dir: /fs/fast/u20240075/luoyashuo/tmp/evalscope_sandbox

# 评测配置 - 不指定子集，测试所有默认子集
benchmarks:
  # MATH
  MinervaMath:
    dataset_name: "minerva_math"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    judge_strategy: llm_recall   # 先规则验证，规则不通过再用 LLM judge
    # judge_model: "Pro/MiniMaxAI/MiniMax-M2.5" # SiliconFlow 上的 judge 模型
    judge_model: "qwen3-235b-a22b"
    judge_parallel: 8           # LLM judge 并发数，默认 1（串行）避免触发 TPM/RPM 限制

  MATH500:
    dataset_name: "math_500"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  AMC:
    dataset_name: "amc"
    subset: "amc24"  # AMC 必须指定年份作为子集
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  IMOAnswerBench:
    dataset_name: "imo_answer_bench"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  AGIEvalMath:
    dataset_name: "agieval_math"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0

  GSM8K:
    dataset_name: "gsm8k"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
  # General
  GPQA:
    dataset_name: "gpqa_diamond"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false

