# EvalScope V2 评测配置文件 - 基线/基础模型评测
# 适用于 eval_v2.py（跨 Benchmark 流式推理）
#
# 特点：
# - temperature=1.0（基线模型评测推荐，与 SFT 的 0.6 不同）
# - max_tokens 相对较小（16000），适合基线模型
# - 所有 prompts 混合后统一调度

model_path: /data/modelscope_cache/models/Qwen/Qwen2.5-7B-Instruct

# 评测 API 配置（用于 LLM judge）
BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
API_KEY: sk-9ae88192c0e54080831b8a7408d2da8d

# vLLM 配置（离线模式）
vllm:
  tp: 1
  dp: 8
  gpu_memory_utilization: 0.95
  max_model_len: 32768
  enforce_eager: false
  
  # eval_v2.py 特有参数
  eval_batch_size: 1024
  tps_interval: 30

# 沙箱配置
sandbox:
  work_dir: /data/tmp/evalscope_sandbox

# 评测配置
benchmarks:
  # ==================== MATH Benchmarks ====================
  AIME25:
    dataset_name: "aime25"
    repeats: 24
    temperature: 1.0           # 基线模型使用 1.0
    max_tokens: 12000          # 基线模型使用较短长度
    few_shot_num: 0
    use_sandbox: false

  AIME24:
    dataset_name: "aime24"
    repeats: 24
    temperature: 1.0
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false

  MATH500:
    dataset_name: "math_500"
    repeats: 8
    temperature: 1.0
    max_tokens: 12000
    few_shot_num: 0

  AMC:
    dataset_name: "amc"
    subset: "amc23"
    repeats: 16
    temperature: 1.0
    max_tokens: 12000
    few_shot_num: 0

  AGIEvalMath:
    dataset_name: "agieval_math"
    repeats: 4
    temperature: 1.0
    max_tokens: 12000
    few_shot_num: 0

  GSM8K:
    dataset_name: "gsm8k"
    repeats: 4
    temperature: 1.0
    max_tokens: 12000
    few_shot_num: 0

  # ==================== General Benchmarks ====================
  GPQA:
    dataset_name: "gpqa_extend"
    repeats: 4
    temperature: 0.6
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false

  MMLUProNoMath:
    dataset_name: "mmlu_pro_no_math"
    repeats: 1
    temperature: 0.6
    max_tokens: 12000
    few_shot_num: 0

  ARC:
    dataset_name: "arc"
    subset: "ARC-Challenge"
    repeats: 3
    temperature: 0.6
    max_tokens: 12000
    few_shot_num: 0
    data_source: huggingface