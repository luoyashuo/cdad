# EvalScope 评测配置文件 - 仅测试代码评测 (HumanEval, LiveCodeBench, MBPP)
# 模型路径
model_path: /fs/fast/u20240075/hf_home/models/asas-ai-Llama-3.2-1B-Open-R1-Distill

# 千问 API (用于 LLM judge，代码评测通常不需要)
BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
API_KEY: sk-9ae88192c0e54080831b8a7408d2da8d

# vLLM配置（离线模式，直接加载模型，无需HTTP服务）
vllm:
  tp: 1              # tensor parallel size（每个DP分片占几张GPU）
  dp: 1              # data parallel size（几个LLM实例，dp>1时用Ray）
  gpu_memory_utilization: 0.9
  max_model_len: 16384
  enforce_eager: true # 禁用CUDA graph编译

# 评测配置
eval:
  batch_size: 64      # evalscope每次传给模型的batch大小（离线模式下vLLM自动调度）

# 沙箱配置
# 远程沙盒模式（推荐，Docker 本地不可用时使用）：
#   在有 Docker 的机器上运行: ms-enclave server --host 0.0.0.0 --port 8001
#   然后填写下面的 remote_url
sandbox:
  remote_url: http://8.152.253.195:1234
  timeout: 120  # 代码执行超时时间（秒）
  work_dir: /fs/fast/u20240075/luoyashuo/tmp/evalscope_sandbox
# 评测配置 - 仅代码评测

benchmarks:
  # MBPP: Mostly Basic Python Problems，基础 Python 编程问题
  MBPP:
    dataset_name: "mbpp"
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false
  # HumanEval: 经典的代码生成评测，包含 164 个 Python 编程问题
  HumanEval:
    dataset_name: "humaneval"
    # limit: 5  # 快速验证：只跑5个样本
    repeats: 1
    temperature: 0.7
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false


  # LiveCodeBench: 包含 LeetCode 风格的编程题目
  # test_n 版本选择（单版本：v1~v6；累积版本：release_v1~release_v6 / release_latest）
  #   v1        → test.jsonl  (400 题，2023-08 起)
  #   v2        → test2.jsonl (111 题)
  #   v3~v6     → test3~6.jsonl
  #   release_latest → 全部 6 个文件
  # 结果按 difficulty 分类输出：easy / medium / hard / all
  LiveCodeBench:
    dataset_name: "live_code_bench"
    # limit: 5  # 快速验证：只跑5个样本
    repeats: 1
    temperature: 0.6
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false
    extra_params:
      version: v2  # 可选：v1~v6 / release_v1~release_v6 / release_latest




  # BigCodeBench: 1140个高质量 Python 编程任务，使用 unittest 验证
  # 支持本地执行（use_sandbox: false），无需 Docker
  BigCodeBench:
    dataset_name: "bigcodebench"
    # limit: 5  # 快速验证：只跑5个样本
    repeats: 1
    temperature: 1.0
    max_tokens: 12000
    few_shot_num: 0
    use_sandbox: false  # 本地 multiprocessing 执行，无需 Docker