# vLLM配置（离线模式，直接加载模型，无需HTTP服务）
vllm:
  tp: 1              # tensor parallel size（3B模型单卡即可）
  dp: 8              # data parallel size（两张卡并行，吞吐翻倍）
  gpu_memory_utilization: 0.9
  max_model_len: 16384
  enforce_eager: false # 对于RUC的机器需要关闭
  worker_chunk_size: 128  # dp>1时每个Worker每轮的prompt数（越大越能利用vLLM continuous batching）

# 沙箱配置 - 临时文件存储路径 (避免打爆主机存储)
sandbox:
  work_dir: /data/tmp/evalscope_sandbox

