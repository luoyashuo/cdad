# EvalScope V2 评测配置文件 - SFT 模型评测
# 适用于 eval_v2.py（跨 Benchmark 流式推理）
#
# 特点：
# - 所有 prompts 混合后统一调度，无需 per-benchmark worker_chunk_size
# - 通过 eval_batch_size 控制推理并发数
# - temperature=0.6（SFT 模型推荐）

model_path: /data/cdad/checkpoints/tokenskip/llama3_3b_instruct_full_sft_tokenskip_30k_r25

# 评测 API 配置（用于 LLM judge）
BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
API_KEY: sk-9ae88192c0e54080831b8a7408d2da8d

# vLLM 配置（离线模式）
vllm:
  tp: 1                    # tensor parallel size
  dp: 8                    # data parallel size（多卡并行）
  gpu_memory_utilization: 0.95
  max_model_len: 32768
  enforce_eager: false     # RUC 机器需要关闭
  
  # eval_v2.py 特有参数：
  # - eval_batch_size: ThreadPoolExecutor 并发提交数（推荐 4096）
  # - max_dedup_n: n 参数去重上限（0=不限, 8=推荐）。限制 n 可增加 unique prompts 数，
  #   提高 GPU batch 利用率。如 AIME 30题×64 repeats, n=8 → 每卡 30×8=240 有效序列
  # - worker_chunk_size: 每次分发给 Worker 的上限。dp>1 时 0 会自动设为 64，
  #   确保进度实时更新。可手动设置更小值（如 32）获取更细粒度的进度
  # - tps_interval: TPS 打印间隔（秒），设为 0 可禁用
  eval_batch_size: 1536
  max_dedup_n: 8
  worker_chunk_size: 0
  tps_interval: 30

# 沙箱配置
sandbox:
  work_dir: /data/tmp/evalscope_sandbox

# 评测配置
# 注意：eval_v2.py 不需要 per-benchmark worker_chunk_size，
# 因为所有 prompts 是全局混合后统一调度的
benchmarks:
  # ==================== MATH Benchmarks ====================
  AIME25:
    dataset_name: "aime25"
    repeats: 24
    temperature: 0.6
    max_tokens: 28000
    few_shot_num: 0
    use_sandbox: false

  AIME24:
    dataset_name: "aime24"
    repeats: 24
    temperature: 0.6
    max_tokens: 28000
    few_shot_num: 0
