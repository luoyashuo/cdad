### model
model_name_or_path: /data/modelscope_cache/models/LLM-Research/Llama-3.2-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /home/luoys/cdad/LlamaFactory/examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]



### dataset
dataset: deepmath_plain_30k_train_llama3_8b_3b_dual_30k
template: llama3
cutoff_len: 9000
max_samples: 9999999999
preprocessing_num_workers: 16
dataloader_num_workers: 8
dataloader_prefetch_factor: 4
neat_packing: true

### output
output_dir: /data/cdad/checkpoints/rewrite_cot/llama3_3b_instruct_full_sft_dual_30k
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: fa2
ddp_timeout: 180000000
max_grad_norm: 1.0

### eval
eval_strategy: "no"
