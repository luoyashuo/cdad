### model
model_name_or_path: /data/luoys/modelscope_cache/models/Qwen/Qwen3-4B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: fsf_grm_train
template: qwen3
cutoff_len: 16384
max_samples: 9999999999
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /data/luoys/checkpoints/cdad/fsf_reward/qwen3_4b_fsf_grm
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_dataset: fsf_grm_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 2000
