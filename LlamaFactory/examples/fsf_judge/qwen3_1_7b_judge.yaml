### model
model_name_or_path: /data-share/LLM/Qwen3-1.7B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: fsf_judge_train
template: qwen3
cutoff_len: 8192
max_samples: 9999999999
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /data-share/yeesuanAI08/lihaitao/luoys/checkpoints/cdad/judge/qwen3_1_7b_judge
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_dataset: fsf_judge_val
# val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
