### model
model_name_or_path: /mnt/moonfs/public-models-ksyun/Qwen/Qwen3-1.7B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /mnt/moonfs/luoyashuo-ksyun/code/graphkd/cdad/LlamaFactory/examples/deepspeed/ds_z0_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: omnithought_rv_optimal_train
template: qwen3
cutoff_len: 8192
max_samples: 9999999999
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /mnt/moonfs/luoyashuo-ksyun/research/cdad/ckpt/strategies/qwen3_1_7b_base_sft_rv_optimal
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_dataset: omnithought_rv_optimal_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
