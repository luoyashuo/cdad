### model
# model_name_or_path: /fs/fast/u20240075/luoyashuo/modelscope_cache/models/LLM-Research/Llama-3.2-1B-Instruct
model_name_or_path: /fs/fast/u20240075/luoyashuo/cdad/checkpoints/rv_optimal/llama3_1b_instruct_rv_optimal_50k_ep1/checkpoint-1132
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /home/u20240075/luoyashuo/projects/cdad/LlamaFactory/examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: omnithought_rv_optimal_50k_train
template: llama3
resize_vocab: true
cutoff_len: 8192
max_samples: 9999999999
preprocessing_num_workers: 16
dataloader_num_workers: 8
dataloader_prefetch_factor: 4 
packing: false # 最好不要pack，可能有bug


### output
output_dir: /fs/fast/u20240075/luoyashuo/cdad/checkpoints/rv_optimal/llama3_1b_instruct_rv_optimal_50k
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
# effective train batch size = 16
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
# flash_attn: fa2 
max_grad_norm: 1.0 # 建议加上，之前效果不好貌似都有grad spike
### eval
eval_dataset: omnithought_rv_optimal_50k_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 1000
