[project]
name = "cot-rewriter-grpo"
version = "0.1.0"
description = "CoT Rewriter training with GRPO algorithm based on verl framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]

dependencies = [
    "torch>=2.6.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "ray[default]>=2.38.0",
    "vllm>=0.6.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "wandb>=0.18.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[tool.uv.sources]
verl = { path = "../verl", editable = true }

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
