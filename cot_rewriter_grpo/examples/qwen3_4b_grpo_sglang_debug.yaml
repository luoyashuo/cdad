# SGLang Rollout 调试配置
# 使用简单的规则 reward，用于调试 SGLang rollout 是否正常工作
#
# Usage:
#   bash scripts/grpo/run_train.sh qwen3_4b_grpo_sglang_debug 0,1,2,3

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ Experiment Configuration ============
trainer:
  project_name: sglang_debug
  experiment_name: qwen3_4b_sglang_rule_reward
  total_epochs: 1
  total_training_steps: 10  # 只跑 10 步用于调试
  save_freq: 100
  test_freq: 100
  val_before_train: false
  device: cuda
  log_freq: 1  # 每步都打印日志
  max_actor_ckpt_to_keep: 1
  default_local_dir: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/sglang_debug
  n_gpus_per_node: 4
  nnodes: 1
  logger: ["console"]  # 只用 console，不用 swanlab

data:
  train_files: /home/u20240075/luoyashuo/data/cdad/cot_rewrite_max_fsf_v2/train.jsonl
  val_files: /home/u20240075/luoyashuo/data/cdad/cot_rewrite_max_fsf_v2/val.jsonl
  # IMPORTANT: train_batch_size * rollout.n 必须 >= n_gpus_per_node
  # 这里 2 * 4 = 8 >= 4 ✓
  train_batch_size: 2
  val_batch_size: 2
  gen_batch_size: 8
  max_prompt_length: 6000  # 缩短以加速调试
  max_response_length: 6000
  return_raw_chat: true
  dataloader_num_workers: 2
  reward_fn_key: reward_model
  prompt_key: problem
  apply_chat_template_kwargs:
    enable_thinking: false
  custom_cls:
    path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/utils/dataset/rl_dataset_jsonl.py
    name: RLHFDatasetJSONL

# ============ Actor/Rollout/Ref Configuration ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    path: /fs/fast/u20240075/hf_home/models/Qwen/Qwen3-4B
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    grad_clip: 1.0
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      dtype: float16
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp16
    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.1
      min_lr_ratio: 0.1
      total_training_steps: -1

  rollout:
    # 使用 SGLang 引擎
    name: sglang
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5  # 降低内存占用
    dtype: float16
    log_prob_micro_batch_size_per_gpu: 1
    n: 4  # train_batch_size(2) * n(4) = 8 >= n_gpus(4)
    temperature: 0.7
    top_p: 0.95
    # 减少序列长度用于调试
    prompt_length: 512
    response_length: 256
    max_num_batched_tokens: 2048
    max_model_len: 1024
    enforce_eager: true
    # 先禁用 free_cache_engine 进行调试
    free_cache_engine: false
    # sleep_level: 2
    # SGLang 特定配置
    update_weights_bucket_megabytes: 1024
    # SGLang 加载格式
    load_format: dummy

  ref:
    enable: false

# ============ Algorithm Configuration ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

# ============ Critic Configuration ============
critic:
  enable: false

# ============ Reward Model Configuration ============
reward_model:
  enable: false
  reward_manager: cot_rewriter
  offload_rollout_for_reward: false  # 规则 reward 不需要 offload
  task_runner_num_gpus: 0

# ============ Custom Reward Function - 使用简单规则 ============
custom_reward_function:
  path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/experimental/reward/cot_rewriter/rule_reward.py
  name: compute_rule_reward
  reward_kwargs:
    length_penalty: -0.0001
    min_length_bonus: 0.5
    min_length: 50

# ============ Reward Manager Configuration ============
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/experimental/reward/cot_rewriter/reward_manager.py

# ============ Ray Configuration ============
ray_init:
  num_cpus: null
  timeline_json_file: null
