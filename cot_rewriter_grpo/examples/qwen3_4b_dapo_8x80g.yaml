# CoT Rewriter DAPO Training Configuration (vLLM Rollout + SGLang Reward)
# Hardware: 8 x 80GB A100/H100 GPUs
# Model: Qwen3-4B Full Parameter Training (无 LoRA)
#
# 配置说明：
#   - Rollout 使用 vLLM（更稳定）
#   - Reward 计算使用 SGLang（节约 logprob 开销）
#   - DAPO 算法：Separated Clip Epsilons + 动态采样过滤截断组
#
# 路径配置说明：
#   所有路径都通过环境变量配置，在 scripts/grpo/run_train.sh 中设置
#   - MODEL_BASE_DIR: 模型根目录
#   - DATA_BASE_DIR: 数据根目录
#   - CHECKPOINT_BASE_DIR: 检查点根目录
#   - PROJECT_BASE_DIR: 项目代码根目录（用于拼接代码路径）

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ Experiment Configuration ============
trainer:
  project_name: cot_rewriter_dapo
  experiment_name: qwen3_4b_dapo_8x80g
  total_epochs: 1
  total_training_steps: 500
  save_freq: 50
  test_freq: 50
  val_before_train: false
  device: cuda
  log_freq: 10
  max_actor_ckpt_to_keep: 3
  # 检查点保存路径（使用 CHECKPOINT_BASE_DIR 环境变量）
  default_local_dir: ${oc.env:CHECKPOINT_BASE_DIR}/cot_rewriter_dapo/${trainer.experiment_name}
  n_gpus_per_node: 8
  nnodes: 1
  logger: ["swanlab","console"]

  rollout_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/${trainer.experiment_name}/rollout_data
  validation_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/${trainer.experiment_name}/validation_data

data:
  # 数据路径（使用 DATA_BASE_DIR 环境变量）
  train_files: ${oc.env:DATA_BASE_DIR}/cot_rewrite_max_fsf_v3/train.jsonl
  val_files: ${oc.env:DATA_BASE_DIR}/cot_rewrite_max_fsf_v3/val.jsonl
  train_batch_size: 2
  val_batch_size: 2
  gen_batch_size: 2    # DAPO: 可能因过滤需要多轮生成
  max_prompt_length: 5500
  max_response_length: 10000
  return_raw_chat: true
  dataloader_num_workers: 8
  reward_fn_key: reward_model
  prompt_key: problem
  apply_chat_template_kwargs:
    enable_thinking: false

  # 使用相对路径（基于 PROJECT_BASE_DIR）
  custom_cls:
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/utils/dataset/rl_dataset_jsonl.py
    name: RLHFDatasetJSONL

# ============ Actor/Rollout/Ref Configuration ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    # Actor Model 路径（使用 MODEL_BASE_DIR 环境变量）
    path: ${oc.env:MODEL_BASE_DIR}/Qwen/Qwen3-4B
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 0  # 全参数训练

  actor:
    strategy: fsdp2
    ppo_epochs: 1
    # ========== DAPO: Separated Clip Epsilons ==========
    clip_ratio: 0.2
    clip_ratio_low: 0.2      # DAPO: 下界 clip ratio
    clip_ratio_high: 0.28    # DAPO: 上界 clip ratio (1.4x low)
    # ========== DAPO: Token-level Loss ==========
    loss_agg_mode: "token-mean"  # DAPO: token 级别损失聚合
    entropy_coeff: 0.01
    grad_clip: 1.0
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    use_kl_in_reward: false
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_from_logits_with_chunking: true

    fsdp_config:
      dtype: bfloat16
      param_offload: false
      optimizer_offload: false
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: bf16
    optim:
      lr: 2e-5
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: -1

  # ========== vLLM Rollout 配置 ==========
  rollout:
    name: vllm
    tensor_model_parallel_size: 4
    gpu_memory_utilization: 0.65
    dtype: bfloat16
    load_format: dummy_dtensor
    log_prob_micro_batch_size_per_gpu: 2
    n: 8  # GRPO/DAPO 组大小
    temperature: 1.0
    top_p: 0.95
    prompt_length: 5500
    response_length: 10000
    max_num_batched_tokens: 62000
    max_model_len: 15500
    enforce_eager: true
    free_cache_engine: true
    sleep_level: 1
    agent:
      num_workers: 8

  ref:
    enable: false
    log_prob_micro_batch_size_per_gpu: 2

# ============ Algorithm Configuration ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0

  # ========== DAPO: 动态采样过滤 ==========
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: true
    metric: "truncated"  # 按截断过滤：组内至少 2 个样本未截断才保留
    max_num_gen_batches: 10  # 最多生成 10 轮，<=0 表示无限制

# ============ Critic Configuration (GRPO/DAPO doesn't need) ============
critic:
  enable: false

# ============ Reward Model Configuration ============
reward_model:
  enable: false
  reward_manager: cot_rewriter  # CoT Rewriter reward manager (compatible with compute_cot_rewriter_reward)
  offload_rollout_for_reward: true
  task_runner_num_gpus: 0

  # ========== Reward kwargs (passed to reward manager) ==========
  reward_kwargs:
    # ========== DAPO: Overlong Reward Shaping ==========
    overlong_buffer_cfg:
      enable: true         # Disabled: using truncation_penalty in compute_cot_rewriter_reward instead
      len: 3000            # Buffer length (penalty starts after max_response_length - buffer_len)
      penalty_factor: 0.5  # Maximum penalty value
      log: false           # Whether to log overlong reward
    max_resp_len: 10000    # Required when overlong_buffer_cfg.enable=true

# ============ Custom Reward Function Configuration ============
# 注意：当前配置只使用认知奖励 (Cognitive Reward)，不使用逻辑奖励 (Logic Reward)
# 使用 SGLang 进行 reward 计算（节约 logprob 开销）
custom_reward_function:
  path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/combined_reward.py
  name: compute_cot_rewriter_reward
  reward_kwargs:
    # ========== Student Model 配置（认知奖励必需）==========
    student_model_path: ${oc.env:MODEL_BASE_DIR}/Qwen/Qwen3-1.7B-Base
    student_tensor_parallel_size: 2
    student_max_model_len: 12000
    student_micro_batch_size: 2

    # ========== 奖励计算配置 ==========
    use_logic_reward: false
    alpha: 0.01
    reward_backend: sglang
    sglang_mem_fraction_static: 0.30
    cleanup_after_compute: true

    # ========== 其他配置 ==========
    print_samples: 2
    truncation_penalty: 0.0   # 截断惩罚（finish_reason == "length" 时应用，配置为正数）
    format_penalty: 0.5        # 格式惩罚（响应包含 "# question" 或 "# rewrit" 时应用，配置为正数）
    field_mapping:
      prompt_key: problem
      reward_model_key: reward_model
      question_key: question
      original_cot_key: original_cot
      ground_truth_key: ground_truth

# ============ Reward Manager Configuration ============
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    # 使用相对路径（基于 PROJECT_BASE_DIR）
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/reward_manager.py

# ============ Ray Configuration ============
ray_kwargs:
  ray_init:
    _temp_dir: null
    include_dashboard: false
    dashboard_host: ""
    dashboard_port: null
    ignore_reinit_error: true
    logging_level: "warning"
    local_mode: false
    namespace: "cot_rewriter_dapo"
    _system_config:
      enable_metrics_collection: false
      agent_register_timeout_ms: 120000
    runtime_env:
      env_vars:
        # PYTHONPATH 使用 PROJECT_BASE_DIR
        PYTHONPATH: "${oc.env:PROJECT_BASE_DIR}/.venv/lib/python3.12/site-packages:${oc.env:PROJECT_BASE_DIR}:${oc.env:PROJECT_BASE_DIR}/src:${oc.env:PROJECT_BASE_DIR}/verl"
        TOKENIZERS_PARALLELISM: "false"
        RAY_DEDUP_LOGS: "1"
        RAY_DASHBOARD_HOST: ""
        RAY_enable_dashboard: "0"
        # CUDA_VISIBLE_DEVICES 会自动继承运行时的环境变量，无需显式配置
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        # 强制使用 vLLM V0 引擎（RUC 服务器兼容性）
        VLLM_USE_V1: "0"
        VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
        # SwanLab 云端同步配置
        SWANLAB_MODE: "cloud"
        SWANLAB_API_KEY: "xmtHYzg2Bw5uh1dprg81E"
  timeline_json_file: null
