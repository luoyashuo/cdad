# GRPO Training Configuration with Reward Model Load/Offload
#
# 这个配置使用 reward model load/offload 机制，避免独立占用 GPU 运行 Reward Server。
#
# Key Features:
# - 所有 GPU 都用于 GRPO 训练
# - Reward models 初始化在 CPU
# - 计算 reward 时临时加载到 GPU（例如 cuda:0）
# - 计算完成后自动卸载回 CPU
# - 不需要独立的 Reward Server
#
# GPU 分配 (4 GPUs: 1,2,3,5):
# - 所有 GPU 用于 Actor Model + vLLM Rollout + GRPO 训练
# - Reward models 动态共享 GPU 0（临时加载/卸载）

trainer:
  _target_: verl.trainer.ppo.ray.RayPPOTrainer

  # Project config
  project_name: cot_rewriter_grpo
  experiment_name: qwen3_8b_grpo_with_offload
  logger:
    - tensorboard
    - swanlab

  # Data config
  train_data:
    parquet_files: data/rl_train.jsonl
    tokenizer_path: /data-share/LLM/Qwen3-8B-Instruct
    max_length: 8000
    prompt_key: problem

  # Model paths
  actor_rollout_ref:
    model:
      path: /data-share/LLM/Qwen3-8B-Instruct
      # 使用所有 4 张卡进行训练
      # Ray init config 中指定 CUDA_VISIBLE_DEVICES

  # Reward config - 使用 load/offload 机制
  reward_model:
    # 使用新的 reward function（支持 load/offload）
    custom_reward_function:
      module: src.reward.combined_reward_with_offload
      function: compute_cot_rewriter_reward_with_offload

    reward_kwargs:
      # Student Model 配置
      student_model_path: /data-share/LLM/Qwen3-1.7B

      # FSF Judge 配置
      fsf_model_path: /data-share/LLM/Qwen3-8B-Instruct
      use_logic_reward: true
      lambda_logic: 0.5

      # Load/Offload 配置 - 关键设置
      enable_offload: true          # 启用 load/offload 机制
      device: cuda:0                # 计算 reward 时使用的 GPU
      offload_device: cpu           # 不计算时模型保存的位置
      allow_cpu: true               # 允许 CPU fallback

      # 字段映射
      field_mapping:
        prompt_key: problem
        question_key: question
        original_cot_key: thought
        ground_truth_key: solution
        reward_model_key: null  # 使用 flat structure

  # GRPO training params
  algorithm:
    gamma: 1.0
    lam: 0.95
    kl_penalty: grpo  # GRPO-specific KL penalty
    adv_estimator: grpo

  # Training params
  n_iters: 100
  rollout_batch_size: 512
  train_batch_size: 256
  gradient_accumulation_steps: 1

  # vLLM rollout params
  rollout:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 2048

  # Optimizer
  actor_optimizer:
    lr: 1e-6
    weight_decay: 0.01

  # Ray config - 使用所有 4 张卡
  ray_kwargs:
    ray_init:
      num_gpus: 4
      runtime_env:
        env_vars:
          CUDA_VISIBLE_DEVICES: "1,2,3,5"
          # Reward 计算在这些 GPU 上（通过 offload 机制）
          # 模型初始在 CPU，计算时临时加载到 GPU

    # Actor rollout workers (使用所有 GPU)
    actor_rollout_worker:
      num_workers: 4
      resources_per_worker:
        num_gpus: 1

    # GRPO training workers (使用所有 GPU)
    train_worker:
      num_workers: 4
      resources_per_worker:
        num_gpus: 1

    # Reward workers (使用 CPU + 临时 GPU offload)
    reward_worker:
      num_workers: 2
      resources_per_worker:
        num_cpus: 4
        # 不分配 GPU，通过 offload 机制临时使用
