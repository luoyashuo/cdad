# CoT Rewriter GRPO Training Configuration (vLLM Rollout + SGLang Reward)
# Hardware: 8 x 80GB A100/H100 GPUs
# Model: Qwen3-4B Full Parameter Training (无 LoRA)
#
# 配置说明：
#   - Rollout 使用 vLLM（更稳定）
#   - Reward 计算使用 SGLang（节约 logprob 开销）
#   - 相比 2GPU 版本，主要 scaling 了 batch size、TP size 和并行度
#
# 路径配置说明：
#   所有路径都通过环境变量配置，在 scripts/grpo/run_train.sh 中设置
#   - MODEL_BASE_DIR: 模型根目录
#   - DATA_BASE_DIR: 数据根目录
#   - CHECKPOINT_BASE_DIR: 检查点根目录
#   - PROJECT_BASE_DIR: 项目代码根目录（用于拼接代码路径）

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ Experiment Configuration ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen3_4b_8gpu_80g_vllm_rollout_sglang_reward
  total_epochs: 1
  total_training_steps: 500
  save_freq: 50
  test_freq: 50
  val_before_train: false
  device: cuda
  log_freq: 10
  max_actor_ckpt_to_keep: 3
  # 检查点保存路径（使用 CHECKPOINT_BASE_DIR 环境变量）
  default_local_dir: ${oc.env:CHECKPOINT_BASE_DIR}/cot_rewriter_grpo/${trainer.experiment_name}
  n_gpus_per_node: 8  # [SCALED] 2 -> 8
  nnodes: 1
  logger: ["swanlab","console"]

  rollout_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/${trainer.experiment_name}/rollout_data
  validation_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/${trainer.experiment_name}/validation_data

data:
  # 数据路径（使用 DATA_BASE_DIR 环境变量）
  train_files: ${oc.env:DATA_BASE_DIR}/cot_rewrite_max_fsf_v2/train.jsonl
  val_files: ${oc.env:DATA_BASE_DIR}/cot_rewrite_max_fsf_v2/val_64.jsonl
  train_batch_size: 4  # [SCALED] 1 -> 4 (4x GPU, 4x batch)
  val_batch_size: 4    # [SCALED] 1 -> 4
  gen_batch_size: 4    # [SCALED] 1 -> 4
  max_prompt_length: 5500
  max_response_length: 5500
  return_raw_chat: true
  dataloader_num_workers: 8  # [SCALED] 2 -> 8 (匹配 GPU 数量)
  reward_fn_key: reward_model
  prompt_key: problem
  apply_chat_template_kwargs:
    enable_thinking: false

  # 使用相对路径（基于 PROJECT_BASE_DIR）
  custom_cls:
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/utils/dataset/rl_dataset_jsonl.py
    name: RLHFDatasetJSONL

# ============ Actor/Rollout/Ref Configuration ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    # Actor Model 路径（使用 MODEL_BASE_DIR 环境变量）
    path: ${oc.env:MODEL_BASE_DIR}/Qwen/Qwen3-4B
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false

    # 全参数训练，不使用 LoRA
    lora_rank: 0

  actor:
    strategy: fsdp2
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    grad_clip: 1.0
    ppo_mini_batch_size: 4   # [SCALED] 1 -> 4 (匹配 train_batch_size)
    ppo_micro_batch_size_per_gpu: 1  # 保持 1，避免 OOM
    use_kl_in_reward: false
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl

    fsdp_config:
      dtype: bfloat16
      param_offload: false
      optimizer_offload: false
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: bf16
    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: -1

  # ========== vLLM Rollout 配置 ==========
  rollout:
    name: vllm
    tensor_model_parallel_size: 4  # [SCALED] 2 -> 4 (使用一半 GPU 做 TP)
    gpu_memory_utilization: 0.65   # [SCALED] 0.50 -> 0.65 (TP=4 后每卡压力减小，可提高)
    dtype: bfloat16
    load_format: dummy_dtensor
    log_prob_micro_batch_size_per_gpu: 4  # [SCALED] 1 -> 4
    n: 8  # GRPO 组大小
    temperature: 1.0
    top_p: 0.95
    prompt_length: 5500
    response_length: 5500
    max_num_batched_tokens: 44000  # batch_size(4) * (5500+5500) = 44000，TP=4 可适当提高吞吐
    max_model_len: 11000
    enforce_eager: true
    free_cache_engine: true
    sleep_level: 1
    agent:
      num_workers: 8  # [SCALED] 2 -> 8 (匹配 GPU 数量，提高并行)

  ref:
    enable: false
    log_prob_micro_batch_size_per_gpu: 4  # [SCALED] 1 -> 4

# ============ Algorithm Configuration ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0

# ============ Critic Configuration (GRPO doesn't need) ============
critic:
  enable: false

# ============ Reward Model Configuration ============
reward_model:
  enable: false
  reward_manager: cot_rewriter
  offload_rollout_for_reward: true
  task_runner_num_gpus: 0

# ============ Custom Reward Function Configuration ============
# 注意：当前配置只使用认知奖励 (Cognitive Reward)，不使用逻辑奖励 (Logic Reward)
# 使用 SGLang 进行 reward 计算（节约 logprob 开销）
custom_reward_function:
  path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/combined_reward.py
  name: compute_cot_rewriter_reward
  reward_kwargs:
    # ========== Student Model 配置（认知奖励必需）==========
    student_model_path: ${oc.env:MODEL_BASE_DIR}/Qwen/Qwen3-1.7B
    # student_devices: 不设置时自动使用所有可见 GPU (CUDA_VISIBLE_DEVICES)
    student_tensor_parallel_size: 1
    student_max_model_len: 12000
    student_micro_batch_size: 4  # [SCALED] 1 -> 4 (匹配 batch size)

    # ========== 奖励计算配置 ==========
    use_logic_reward: false
    alpha: 0.01
    reward_backend: sglang
    sglang_mem_fraction_static: 0.30  # [SCALED] 0.40 -> 0.30 (总显存增加，可以适当降低每卡占比)
    cleanup_after_compute: true

    # ========== 其他配置 ==========
    print_samples: 2
    truncation_penalty: 0.0
    field_mapping:
      prompt_key: problem
      reward_model_key: reward_model
      question_key: question
      original_cot_key: original_cot
      ground_truth_key: ground_truth

# ============ Reward Manager Configuration ============
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    # 使用相对路径（基于 PROJECT_BASE_DIR）
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/reward_manager.py

# ============ Ray Configuration ============
ray_kwargs:
  ray_init:
    _temp_dir: null
    include_dashboard: false
    dashboard_host: ""
    dashboard_port: null
    ignore_reinit_error: true
    logging_level: "warning"
    local_mode: false
    namespace: "cot_rewriter_grpo"
    _system_config:
      enable_metrics_collection: false
      agent_register_timeout_ms: 120000
    runtime_env:
      env_vars:
        # PYTHONPATH 使用 PROJECT_BASE_DIR
        PYTHONPATH: "${oc.env:PROJECT_BASE_DIR}/.venv/lib/python3.12/site-packages:${oc.env:PROJECT_BASE_DIR}:${oc.env:PROJECT_BASE_DIR}/src:${oc.env:PROJECT_BASE_DIR}/verl"
        TOKENIZERS_PARALLELISM: "false"
        RAY_DEDUP_LOGS: "1"
        RAY_DASHBOARD_HOST: ""
        RAY_enable_dashboard: "0"
        # CUDA_VISIBLE_DEVICES 会自动继承运行时的环境变量，无需显式配置
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        # 强制使用 vLLM V0 引擎（RUC 服务器兼容性）
        VLLM_USE_V1: "0"
        VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
  timeline_json_file: null
