hydra:
  searchpath:
  - file://verl/verl/trainer/config

defaults:
- ppo_trainer
- _self_

# ========== 基础训练配置 ==========
trainer:
  project_name: cot_rewriter_grpo_kl
  experiment_name: llama3_8b_3b_grpo_8x40g_v3
  total_epochs: 1000
  total_training_steps: 500
  save_freq: 10
  test_freq: 10
  val_before_train: false
  device: cuda
  log_freq: 10
  max_actor_ckpt_to_keep: 3
  default_local_dir: ${oc.env:CHECKPOINT_BASE_DIR}/cot_rewriter_grpo/${trainer.experiment_name}
  n_gpus_per_node: 8
  nnodes: 1
  logger: [swanlab, console]
  rollout_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/rollout_data/${trainer.experiment_name}
  validation_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/validation_data/${trainer.experiment_name}

# ========== 数据配置 ==========
data:
  train_files: ${oc.env:DATA_BASE_DIR}/cot_rewrite_deepmath_fsf_1to3/train.jsonl
  val_files: ${oc.env:DATA_BASE_DIR}/cot_rewrite_deepmath_fsf_1to3/val.jsonl
  train_batch_size: 16
  val_batch_size: 16
  gen_batch_size: 16
  max_prompt_length: 4800
  max_response_length: 10000
  return_raw_chat: true
  dataloader_num_workers: 8
  reward_fn_key: reward_model
  prompt_key: problem
  apply_chat_template_kwargs:
    enable_thinking: false
  custom_cls:
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/utils/dataset/rl_dataset_jsonl.py
    name: RLHFDatasetJSONL

# ========== Actor & Rollout 配置 ==========
actor_rollout_ref:
  hybrid_engine: true

  # 模型配置
  model:
    path: ${oc.env:MODEL_BASE_DIR}/models/LLM-Research/Meta-Llama-3.1-8B-Instruct
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 32              # LoRA rank，32 是一个较好的平衡点
    lora_alpha: 64              # LoRA 缩放因子，alpha/rank=2
    lora_dropout: 0.05          # LoRA dropout，增加探索性
    target_modules: all-linear   # 对所有线性层应用 LoRA

  # Actor 训练配置
  actor:
    strategy: fsdp
    ppo_epochs: 1
    policy_loss:
      loss_mode: vanilla  # GRPO 算法
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    entropy_coeff: 0.0 # 小一点，太大了不收敛
    entropy_coeff_lower_bound: 0.0
    grad_clip: 1.0
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1    # 降低到 1 避免 OOM
    use_kl_in_reward: false
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_from_logits_with_chunking: true
    fsdp_config:
      dtype: bfloat16
      param_offload: true
      optimizer_offload: true
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: bf16
      wrap_policy:
        transformer_layer_cls_to_wrap: [LlamaDecoderLayer]
        min_num_params: 0
    optim:
      lr: 3e-5                 # LoRA 使用更高的学习率
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.1
      min_lr_ratio: 0.1
      total_training_steps: -1

  # Rollout (推理) 配置
  rollout:
    name: vllm
    tensor_model_parallel_size: 2    # TP=2: 7B 模型 8x40G 下分2卡推理
    gpu_memory_utilization: 0.6    # 降低 KV cache 为 reward 模型留空间
    dtype: bfloat16
    load_format: auto
    enforce_eager: false  
    log_prob_micro_batch_size_per_gpu: 1    # 降低到 1 避免 OOM
    n: 8
    temperature: 1.0
    top_k: 50
    top_p: 0.95
    presence_penalty: 1.5
    prompt_length: 4800
    response_length: 8192
    max_num_batched_tokens: 48000
    max_model_len: 13000
    free_cache_engine: true
    sleep_level: 1               # sleep_level=2会乱码，只能sleep_level=1
    agent:
      num_workers: 8
  # Ref 模型配置 (用于 KL 散度计算)
  ref:
    enable: true
    log_prob_micro_batch_size_per_gpu: 1    # 降低到 1 避免 OOM
    strategy: fsdp
    fsdp_config:
      dtype: bfloat16
      param_offload: true
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: bf16
      wrap_policy:
        transformer_layer_cls_to_wrap: [LlamaDecoderLayer]
        min_num_params: 0

# ========== 算法配置 ==========
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_group: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  kl_penalty: kl

  kl_ctrl:
    type: fixed
    kl_coef: 0.0

  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: false
    metric: length_ratio
    max_num_gen_batches: -1

# ========== Critic 配置 (GRPO 不需要) ==========
critic:
  enable: false

# ========== Reward Model 配置 ==========
reward_model:
  enable: false
  reward_manager: cot_rewriter
  offload_rollout_for_reward: true
  task_runner_num_gpus: 0

  # Reward kwargs (传递给 reward manager)
  reward_kwargs:
    # 过长惩罚：response 超过 max_resp_len - len 时 reward=0
    overlong_buffer_cfg:
      enable: false
      len: 2000
      log: false
    max_resp_len: 10000

# ========== Ray 分布式配置 ==========
# Ray 初始化配置（代码直接访问 ray_init，而非 ray_kwargs.ray_init）


# ========== 自定义奖励函数配置 ==========
custom_reward_function:
  path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/combined_reward.py
  name: compute_cot_rewriter_reward

  reward_kwargs:
    # ==================== Student Model 配置 (认知奖励 R_cog) ====================
    # 使用 student model 计算回答困惑度作为认知奖励
    student_model_path: ${oc.env:MODEL_BASE_DIR}/models/LLM-Research/Llama-3.2-3B-Instruct
    student_tensor_parallel_size: 1    # 7B 模型用 TP=1
    student_max_model_len: 8192
    student_micro_batch_size: 1
    student_max_num_seqs: 1

    # Student Model 推理后端配置
    reward_backend: sglang            # 可选: sglang | vllm
    sglang_mem_fraction_static: 0.50    # 40GB GPU，需为其他模型留空间
    vllm_gpu_memory_utilization: 0.50   # 40GB GPU，需为其他模型留空间
    cleanup_after_compute: true       # 计算后清理缓存
    # 认知奖励模式
    reward_mode: kl
    ppl_delta_temperature: 1.0       # sigmoid 温度，控制曲线陡峭度 (越小越陡)
    w_kl_cot: 0.75
    w_kl_answer: 0.25
    # 以下参数为其他 mode 使用，ppl_delta_norm_sigmoid 模式下不生效
    cot_effect_epsilon: 0.01          # cot_effect_delta_sigmoid 模式：避免除零的小常数
    cot_effect_temperature: 1.0       # cot_effect_delta_sigmoid 模式：sigmoid 温度
    cot_effect_ratio_ceiling: 2       # cot_effect_ratio 模式的天花板
    ppl_ratio_ceiling: 999            # ppl_ratio 模式的天花板
    ppl_on_full_response: true       # 是否对整个 response 计算 PPL (Q+CoT+A)
                                        # true: 对整个 response 计算 PPL
                                        # false: 只对 answer 部分计算 PPL (默认)
    print_samples: 2                  # 打印样本数
    # ==================== KL Reward 配置 (reward_mode: kl) ====================
    # KL reward 使用 Group-wise 自适应归一化
    # KL 方向: D_KL(actor || student)，使用 k3 估计器
    # 公式: k3_t = (r - 1) - log(r), 其中 r = π_actor / π_student
    #       r_KL = avg(k3_t) + alpha_kl * max(k3_t)
    #       R_cog = sigmoid(-r_KL / τ), 其中 τ = max(r_std, ε) + r_mean
    # 当 reward_mode = "kl" 时启用
    alpha_kl: 0.01                   # max(k3_t) 的权重系数 (默认 0.01)
    kl_eps: 1e-6                     # 防止除零的小量 (默认 1e-6)
    kl_fallback_tau: 3.0             # group_size=1 时的 fallback tau 值
    # ==================== 认知奖励公式配置 ====================
    # R_cog = answer_log_prob(rewrite) - answer_log_prob(original)
    # answer_log_prob = mean(token_log_probs) + alpha * min(token_log_probs)
    alpha: 0.01                       # min-log-prob 的权重系数
    use_reward_delta: false            # 是否使用奖励差值 (rewrite - original)
    # ==================== 阶梯式奖励配置 (Tiered Reward) ====================
    # 当 rewrite 使困惑度降低达到一定阈值时给予额外奖励
    use_tiered_reward: false           # 是否启用阶梯奖励
    tier_step: 0.001                   # 阶梯步长 (5% 改善)
    tier_reward: 0.002                  # 每阶梯奖励值
    # ==================== Logic Reward 配置 (GED over reasoning graph) ====================
    # 使用 FSF Judge 生成 original/rewrite 的 reasoning graph DOT，再计算 GED 相似度奖励
    use_logic_reward: true             # 是否启用 GED logic reward
    lambda_logic: 0.5                  # GED logic reward 权重
    logic_reward_group_size: ${actor_rollout_ref.rollout.n}  # 组内归一化的 group size
    logic_reward_alpha: 0.5            # GED reward sigmoid 陡峭度
    logic_reward_ged_timeout: 5.0      # 单样本 GED 超时秒数
    use_fsf_penalty: false             # 开启 GED reward 时关闭旧的 FSF zero-penalty
    fsf_model_path: /data/hf_home/models/Yaseal-qwen3_4b_fsf_grm
    fsf_tensor_parallel_size: 1
    fsf_temperature: 0.6
    fsf_top_k: 20
    fsf_top_p: 0.95
    fsf_max_new_tokens: 3072
    fsf_gpu_memory_utilization: 0.35   # 40GB GPU，降低避免 OOM
    fsf_max_model_len: 10000
    fsf_micro_batch_size: 1
    fsf_skip_group_on_parse_error: true  # GED 模式下仅保留兼容，不再整组跳过
    save_fsf_dot_outputs: true
    save_prompts: true
    r_logic_repeat_n: 1
    # ==================== Useful 奖励配置 (R_useful) ====================
    # 评估 rewrite 相对于 original 的有用性
    use_useful_reward: false          # 是否启用 useful 奖励
    lambda_useful: 1.0                # useful 奖励权重 λ_useful
    # ==================== Correct Judge 配置 (正确性检测) ====================
    # 判断错误时 reward = 0
    use_correct_judge: true
    correct_judge_model_path: /data/modelscope_cache/models/Qwen/Qwen3-8B
    correct_judge_tensor_parallel_size: 1
    correct_judge_gpu_memory_utilization: 0.50   # 40GB GPU，降低避免 OOM
    correct_judge_max_model_len: 10000
    correct_judge_micro_batch_size: 2
    correct_judge_max_new_tokens: 10
    correct_judge_filter_no_samples: true
    # ==================== 数据字段映射配置 ====================
    field_mapping:
      prompt_key: problem             # 问题字段名
      reward_model_key: reward_model  # 奖励模型字段名
      question_key: question          # 问题文本字段名
      original_cot_key: original_cot  # 原始 CoT 字段名
      ground_truth_key: ground_truth  # 正确答案字段名
    # ==================== Penalty 配置 (零奖励惩罚) ====================
    # 所有 penalty 触发时 reward 直接变为 0
    use_repeat_penalty: false         # 重复惩罚：similarity > threshold 时 reward=0
    similarity_threshold: 0.5         # 重复惩罚阈值
    # truncation_penalty 不需要配置，overlong_buffer_cfg 已覆盖（超长 reward=0）
    format_penalty: 1.0               # > 0 启用格式惩罚
    # 过短惩罚：ratio < too_short_threshold_high 时 reward=0
    too_short_max_penalty: 0.0        # > 0 启用 (当前关闭)
    too_short_threshold_high: 0.4     # 阈值：ratio 低于此值则惩罚
    # 过长惩罚：ratio > too_long_threshold_low 时 reward=0
    too_long_max_penalty: 0.0         # > 0 启用 (当前关闭)
    too_long_threshold_low: 4.0       # 阈值：ratio 高于此值则惩罚
# ============ Reward Manager Configuration ============
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/reward_manager.py

# ============ Ray Configuration ============
ray_init:
  num_cpus:
  timeline_json_file:

ray_kwargs:
  ray_init:
    _temp_dir:
    include_dashboard: false
    dashboard_host: ''
    dashboard_port:
    ignore_reinit_error: true
    logging_level: warning
    local_mode: false
    namespace: cot_rewriter_grpo
    _system_config:
      enable_metrics_collection: false
      agent_register_timeout_ms: 120000
    runtime_env:
      env_vars:
        # PYTHONPATH 使用 PROJECT_BASE_DIR
        PYTHONPATH: ${oc.env:PROJECT_BASE_DIR}/.venv/lib/python3.12/site-packages:${oc.env:PROJECT_BASE_DIR}:${oc.env:PROJECT_BASE_DIR}/src:${oc.env:PROJECT_BASE_DIR}/verl
        TOKENIZERS_PARALLELISM: 'false'
        RAY_DEDUP_LOGS: '1'
        RAY_DASHBOARD_HOST: ''
        RAY_enable_dashboard: '0'
        # CUDA_VISIBLE_DEVICES 会自动继承运行时的环境变量，无需显式配置
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: '0'
        # 防止 torch.cuda.is_available() 在 CUDA_VISIBLE_DEVICES 为空时缓存 False
        # 使用 NVML 检测，支持动态更改 CUDA_VISIBLE_DEVICES
        PYTORCH_NVML_BASED_CUDA_CHECK: '1'
        # 强制使用 vLLM V0 引擎（RUC 服务器兼容性）
        VLLM_USE_V1: '0'
        VLLM_ATTENTION_BACKEND: FLASH_ATTN
        # SwanLab 云端同步配置
        SWANLAB_MODE: cloud
        SWANLAB_API_KEY: xmtHYzg2Bw5uh1dprg81E
