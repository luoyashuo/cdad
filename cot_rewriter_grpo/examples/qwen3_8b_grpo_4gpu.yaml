# CoT Rewriter GRPO Training Configuration
# Hardware: 4 x GPU (1,2,3,5)
# Model: Qwen3-8B (Full Parameter or LoRA)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=1,2,3,5 bash scripts/run_train.sh examples/qwen3_8b_grpo_4gpu.yaml
#
# Architecture:
#   GPU 1-3: Actor Model (Qwen3-8B) + Rollout Engine (训练过程)
#   GPU 5:   Reward Models (Student + FSF Judge, 独立资源池)

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ Experiment Configuration ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen3_8b_4gpu
  total_epochs: 3
  total_training_steps: null
  save_freq: 100
  val_freq: 50
  device: cuda
  log_freq: 10
  # Output directory (timestamp will be added by code)
  default_local_dir: /data-share/yeesuanAI08/lihaitao/luoys/checkpoints/cdad/rewrite/qwen3_8b_grpo_4gpu/${trainer.project_name}/${trainer.experiment_name}
  # 训练使用 3 张 GPU (GPU 1,2,3)
  n_gpus_per_node: 3
  nnodes: 1
  # Logger configuration: console, swanlab, wandb, tensorboard
  logger: ["console", "swanlab"]

data:
  # Use original JSONL directly (field names will be auto-mapped by custom reward function):
  train_files: /data-share/yeesuanAI08/lihaitao/luoys/data/cdad/cot_rewrite_max_fsf/train.jsonl
  val_files: /data-share/yeesuanAI08/lihaitao/luoys/data/cdad/cot_rewrite_max_fsf/val.jsonl
  train_batch_size: 33
  val_batch_size: 16
  gen_batch_size: 32
  max_prompt_length: 1024
  max_response_length: 8192
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model
  prompt_key: problem  # Specify that 'problem' field contains the prompt (not 'prompt')

# ============ Actor/Rollout/Ref Configuration ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    # Actor Model 路径 (参与 GRPO 训练的主模型)
    path: /data-share/yeesuanAI08/lihaitao/luoys/hf_home/models/Qwen/Qwen3-8B
    trust_remote_code: true
    # Enable gradient checkpointing for memory efficiency
    enable_gradient_checkpointing: true
    # LoRA Configuration (empty dict for full parameter training)
    lora: {}

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    grad_clip: 1.0
    ppo_mini_batch_size: 33  # Mini-batch size for PPO training (should match train_batch_size)
    ppo_micro_batch_size_per_gpu: 4  # Micro batch size per GPU for PPO training

    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: -1

  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    dtype: bfloat16
    log_prob_micro_batch_size_per_gpu: 4  # Micro batch size for log prob computation
    n: 8  # GRPO requires multiple samples per prompt
    temperature: 0.7
    top_p: 0.95
    response_length: 8192

  ref:
    enable: false

# ============ Algorithm Configuration ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

# ============ Critic Configuration (GRPO doesn't need) ============
critic:
  enable: false

# ============ Reward Model Configuration ============
# Set to false when using custom reward function
reward_model:
  enable: false

# ============ Custom Reward Function Configuration ============
# Define custom reward function at root level (not under reward_model)
custom_reward_function:
  path: /mnt/yeesuanAI08/lihaitao/luoys/projects/cdad/cot_rewriter_grpo/src/reward/combined_reward.py
  name: compute_cot_rewriter_reward
  reward_kwargs:
    # Student Model (for cognitive reward)
    student_model_path: /data-share/LLM/Qwen3-1.7B
    # FSF Judge Model (for logic reward)
    fsf_model_path: /data-share/yeesuanAI08/lihaitao/luoys/checkpoints/cdad/fsf_judge/qwen3_8b_fsf_judge/checkpoint-12000
    # Device for reward models (single GPU)
    device: cuda:5
    # Reward weights
    lambda_logic: 0.5
    use_logic_reward: false
    # Field mapping to adapt to raw data format (without data_source and reward_model wrapper)
    field_mapping:
      prompt_key: problem      # Use 'problem' field as prompt
      reward_model_key: null   # No nested reward_model structure, read directly from top level
      question_key: question   # Question field name
      original_cot_key: thought  # Original CoT field name (your data uses 'thought')
      ground_truth_key: solution  # Ground truth field name (your data uses 'solution')

# ============ Reward Manager Configuration ============
# Use custom CoT Rewriter reward manager via importlib
# This manager properly interfaces with compute_cot_rewriter_reward (data, tokenizer) interface
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    path: /mnt/yeesuanAI08/lihaitao/luoys/projects/cdad/cot_rewriter_grpo/src/reward/cot_rewriter_reward_manager.py
