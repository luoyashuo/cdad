# CoT Rewriter GRPO Training Configuration
# Hardware: 4 x GPU (1,2,3,5)
# Model: Qwen3-8B (Full Parameter or LoRA)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=1,2,3,5 bash scripts/run_train.sh examples/qwen3_8b_grpo_4gpu.yaml
#
# Architecture:
#   GPU 1-3: Actor Model (Qwen3-8B) + Rollout Engine (训练过程)
#   GPU 5:   Reward Models (Student + FSF Judge, 独立资源池)

hydra:
  searchpath:
    - file://../verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ Experiment Configuration ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen3_8b_4gpu
  total_epochs: 3
  total_training_steps: null
  save_freq: 100
  val_freq: 50
  device: cuda
  log_freq: 10
  # Output directory with timestamp
  default_local_dir: outputs/${trainer.project_name}/${trainer.experiment_name}/version_${now:%Y%m%d_%H%M%S}
  # 训练使用 3 张 GPU (GPU 1,2,3)
  n_gpus_per_node: 3
  nnodes: 1

# ============ Data Configuration ============
# NOTE: VERL requires Parquet format for training data.
# If you have JSON/JSONL data, convert it first:
#   bash scripts/grpo/convert_data.sh <input.jsonl> [output_dir] [train_ratio]
#
# Example:
#   bash scripts/grpo/convert_data.sh data/raw/my_data.jsonl data/processed 0.9
#
# Expected JSONL format per line:
#   {"question": "...", "original_cot": "...", "answer": "..."}
#
# See data/DATA_FORMAT.md for detailed format specification.
# ===========================================
data:
  train_files: data/train.parquet
  val_files: data/val.parquet
  train_batch_size: 32
  val_batch_size: 16
  gen_batch_size: 32
  max_prompt_length: 1024
  max_response_length: 2048
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model

# ============ Actor/Rollout/Ref Configuration ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    # Actor Model 路径 (参与 GRPO 训练的主模型)
    path: /data-share/yeesuanAI08/lihaitao/luoys/hf_home/models/Qwen/Qwen3-8B
    trust_remote_code: true
    dtype: bfloat16
    # LoRA Configuration (set to null for full parameter training)
    lora: null

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    gradient_checkpointing: true
    grad_clip: 1.0

    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: null

  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    mem_fraction_static: 0.8
    n: 8  # GRPO requires multiple samples per prompt
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 2048

  ref:
    enable: false

# ============ Algorithm Configuration ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

# ============ Critic Configuration (GRPO doesn't need) ============
critic:
  enable: false

# ============ Reward Model Configuration ============
reward_model:
  enable: true
  use_reward_loop: false
  # 启用奖励模型独立资源池
  enable_resource_pool: true
  # 奖励模型使用 1 张 GPU (GPU 5)
  n_gpus_per_node: 1
  nnodes: 1
  # 奖励模型并行策略
  strategy: null

  custom_reward_function:
    path: src/reward/combined_reward.py
    name: compute_cot_rewriter_reward
    reward_kwargs:
      # Student Model (for cognitive reward)
      student_model_path: /data-share/LLM/Qwen3-1.7B
      # FSF Judge Model (for logic reward)
      fsf_model_path: /data-share/yeesuanAI08/lihaitao/luoys/checkpoints/cdad/fsf_judge/qwen3_8b_fsf_judge/checkpoint-12000
      # Device for reward models (single GPU)
      device: cuda:5
      # Reward weights
      lambda_logic: 0.5
      use_logic_reward: true

# ============ Reward Manager Configuration ============
reward_manager:
  source: register
  name: naive
