hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ========== 基础训练配置 ==========
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: llama3_8b_grpo_8x80g_v6
  total_epochs: 1
  total_training_steps: 500
  save_freq: 50
  test_freq: 50
  val_before_train: false
  device: cuda
  log_freq: 10
  max_actor_ckpt_to_keep: 3
  default_local_dir: ${oc.env:CHECKPOINT_BASE_DIR}/cot_rewriter_grpo/${trainer.experiment_name}
  n_gpus_per_node: 8
  nnodes: 1
  logger: ["swanlab","console"]
  rollout_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/${trainer.experiment_name}/rollout_data
  validation_data_dir: ${oc.env:CHECKPOINT_BASE_DIR}/${trainer.experiment_name}/validation_data

# ========== 数据配置 ==========
data:
  train_files: ${oc.env:DATA_BASE_DIR}/omnithought_rv_optimal_cot_rewrite_v2/train.jsonl
  val_files: ${oc.env:DATA_BASE_DIR}/omnithought_rv_optimal_cot_rewrite_v2/val.jsonl
  train_batch_size: 1
  val_batch_size: 1
  gen_batch_size: 1
  max_prompt_length: 4600
  max_response_length: 10000
  return_raw_chat: true
  dataloader_num_workers: 8
  reward_fn_key: reward_model
  prompt_key: problem
  apply_chat_template_kwargs:
    enable_thinking: false
  custom_cls:
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/utils/dataset/rl_dataset_jsonl.py
    name: RLHFDatasetJSONL

# ========== Actor & Rollout 配置 ==========
actor_rollout_ref:
  hybrid_engine: true
  
  # 模型配置
  model:
    path: ${oc.env:MODEL_BASE_DIR}/LLM-Research/Meta-Llama-3.1-8B-Instruct
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 0
  
  # Actor 训练配置
  actor:
    strategy: fsdp
    ppo_epochs: 1
    policy_loss:
      loss_mode: vanilla  # GRPO 算法
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    entropy_coeff: 0.001
    entropy_coeff_lower_bound: 0.1
    grad_clip: 1.0
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    use_kl_in_reward: false
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_from_logits_with_chunking: true
    fsdp_config:
      dtype: bfloat16
      param_offload: true
      optimizer_offload: true
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: bf16
      # Llama3 模型的 _no_split_modules 是 None，需要显式配置 wrap_policy
      wrap_policy:
        transformer_layer_cls_to_wrap: ["LlamaDecoderLayer"]
        min_num_params: 0
    optim:
      lr: 2e-6
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.1
      min_lr_ratio: 0.1
      total_training_steps: -1
  
  # Rollout (推理) 配置
  rollout:
    name: vllm
    tensor_model_parallel_size: 4
    gpu_memory_utilization: 0.65
    dtype: bfloat16
    load_format: auto
    log_prob_micro_batch_size_per_gpu: 1
    n: 8
    temperature: 0.6
    top_k: 20
    top_p: 0.95
    presence_penalty: 1.0
    prompt_length: 4600
    response_length: 10000
    max_num_batched_tokens: 62000
    max_model_len: 14600
    enforce_eager: true
    free_cache_engine: true
    sleep_level: 1
    agent:
      num_workers: 8
  # Ref 模型配置 (用于 KL 散度计算)
  ref:
    enable: true
    log_prob_micro_batch_size_per_gpu: 1
    strategy: fsdp
    fsdp_config:
      dtype: bfloat16
      param_offload: true
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: bf16
      # Llama3 模型的 _no_split_modules 是 None，需要显式配置 wrap_policy
      wrap_policy:
        transformer_layer_cls_to_wrap: ["LlamaDecoderLayer"]
        min_num_params: 0

# ========== 算法配置 ==========
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_group: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  kl_penalty: kl
  
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
  
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: false
    metric: length_ratio
    max_num_gen_batches: -1

# ========== Critic 配置 (GRPO 不需要) ==========
critic:
  enable: false

# ========== Reward Model 配置 ==========
reward_model:
  enable: false
  reward_manager: cot_rewriter
  offload_rollout_for_reward: true
  task_runner_num_gpus: 0

  # Reward kwargs (传递给 reward manager)
  reward_kwargs:
    # 过长奖励塑形配置
    overlong_buffer_cfg:
      enable: true
      len: 3000
      penalty_factor: 0.5
      log: false
    max_resp_len: 10000

# ========== Ray 分布式配置 ==========
# Ray 初始化配置（代码直接访问 ray_init，而非 ray_kwargs.ray_init）
  


# ========== 自定义奖励函数配置 ==========
custom_reward_function:
  path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/combined_reward.py
  name: compute_cot_rewriter_reward
  
  reward_kwargs:
    # ==================== 全局配置 ====================
    overworld_buffer_cfg:
      enable: true                    # 是否启用过冲缓冲区
      len: 3000                       # 缓冲区长度
      penalty_factor: 1.0             # 惩罚因子
      log: false                      # 是否记录日志
      max_resp_len: 10000             # 最大响应长度
    
    # ==================== Student Model 配置 (认知奖励 R_cog) ====================
    # 使用 student model 计算回答困惑度作为认知奖励
    student_model_path: /data/luoys/checkpoints/cdad/warmup/qwen3_1_7b_base_sft_rv_optimal/checkpoint-10974
    student_tensor_parallel_size: 2
    student_max_model_len: 12000
    student_micro_batch_size: 1
    student_max_num_seqs: 1
    
    # Student Model 推理后端配置
    reward_backend: sglang            # 可选: sglang | vllm
    sglang_mem_fraction_static: 0.5   # SGLang 显存占比
    vllm_gpu_memory_utilization: 0.3  # vLLM 显存利用率
    cleanup_after_compute: true       # 计算后清理缓存
    
    # 认知奖励模式
    reward_mode: ppl                  # 奖励模式: ppl (困惑度)
    print_samples: 2                  # 打印样本数
    
    # ==================== 认知奖励公式配置 ====================
    # R_cog = answer_log_prob(rewrite) - answer_log_prob(original)
    # answer_log_prob = mean(token_log_probs) + alpha * min(token_log_probs)
    alpha: 0.01                       # min-log-prob 的权重系数
    use_reward_delta: true            # 是否使用奖励差值 (rewrite - original)
    
    # ==================== 阶梯式奖励配置 (Tiered Reward) ====================
    # 当 rewrite 使困惑度降低达到一定阈值时给予额外奖励
    use_tiered_reward: true           # 是否启用阶梯奖励
    tier_step: 0.05                   # 阶梯步长 (5% 改善)
    tier_reward: 0.1                  # 每阶梯奖励值
    
    # ==================== 逻辑奖励 FSF 配置 (R_logic) ====================
    # 使用 FSF (Free-Form Solver Feedback) 模型评估逻辑质量
    use_logic_reward: true            # 是否启用逻辑奖励
    fsf_model_path: /data/luoys/checkpoints/cdad/fsf_reward/qwen3_4b_fsf_grm
    fsf_tensor_parallel_size: 4
    fsf_temperature: 0.6
    fsf_top_k: 20
    fsf_top_p: 0.95
    fsf_max_new_tokens: 8000
    fsf_gpu_memory_utilization: 0.4
    fsf_max_model_len: 12000
    fsf_reward_scale: 1.0             # FSF 奖励缩放因子
    
    # ==================== Useful 奖励配置 (R_useful) ====================
    # 评估 rewrite 相对于 original 的有用性
    use_useful_reward: false          # 是否启用 useful 奖励
    lambda_useful: 1.0                # useful 奖励权重 λ_useful
    
    # ==================== 数据字段映射配置 ====================
    field_mapping:
      prompt_key: problem             # 问题字段名
      reward_model_key: reward_model  # 奖励模型字段名
      question_key: question          # 问题文本字段名
      original_cot_key: original_cot  # 原始 CoT 字段名
      ground_truth_key: ground_truth  # 正确答案字段名
    
    # ==================== 长度惩罚配置 ====================
    # 对过长或过短的 rewrite 进行惩罚
    truncation_penalty: 0.5           # 截断惩罚值
    format_penalty: 0.5               # 格式错误惩罚值
    
    # 过短惩罚阈值
    too_short_threshold_low: 0.4      # 过短下限阈值 (相比 original)
    too_short_threshold_high: 0.8     # 过短上限阈值
    too_short_max_penalty: 0.5        # 最大过短惩罚
    
    # 过长惩罚阈值
    too_long_threshold_low: 1.5       # 过长下限阈值 (相比 original)
    too_long_threshold_high: 2.5      # 过长上限阈值
    too_long_max_penalty: 0.5         # 最大过长惩罚
    
    penalty_mode: absolute            # 惩罚模式: absolute | relative
# ============ Reward Manager Configuration ============
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    path: ${oc.env:PROJECT_BASE_DIR}/verl/verl/experimental/reward/cot_rewriter/reward_manager.py

# ============ Ray Configuration ============
ray_init:
  num_cpus: null
  timeline_json_file: null

ray_kwargs:
  ray_init:
    _temp_dir: null
    include_dashboard: false
    dashboard_host: ""
    dashboard_port: null
    ignore_reinit_error: true
    logging_level: "warning"
    local_mode: false
    namespace: "cot_rewriter_grpo"
    _system_config:
      enable_metrics_collection: false
      agent_register_timeout_ms: 120000
    runtime_env:
      env_vars:
        # PYTHONPATH 使用 PROJECT_BASE_DIR
        PYTHONPATH: "${oc.env:PROJECT_BASE_DIR}/.venv/lib/python3.12/site-packages:${oc.env:PROJECT_BASE_DIR}:${oc.env:PROJECT_BASE_DIR}/src:${oc.env:PROJECT_BASE_DIR}/verl"
        TOKENIZERS_PARALLELISM: "false"
        RAY_DEDUP_LOGS: "1"
        RAY_DASHBOARD_HOST: ""
        RAY_enable_dashboard: "0"
        # CUDA_VISIBLE_DEVICES 会自动继承运行时的环境变量，无需显式配置
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        # 强制使用 vLLM V0 引擎（RUC 服务器兼容性）
        VLLM_USE_V1: "0"
        VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
        # SwanLab 云端同步配置
        SWANLAB_MODE: "cloud"
        SWANLAB_API_KEY: "xmtHYzg2Bw5uh1dprg81E"
