# CoT Rewriter GRPO Training Configuration (Optimized for OOM)
# Hardware: 4 x 80GB A100/H100 GPUs
# Model: Qwen3-4B Full Parameter Training (无 LoRA)
#
# 优化点 (解决 Step 20 OOM):
# 1. 开启 Actor param_offload + optimizer_offload - reward 计算时 offload 到 CPU
# 2. 降低 Student vLLM gpu_memory_utilization 从 0.3 到 0.25
# 3. 限制 Student vLLM max_model_len 避免过长序列
# 4. 保持 rollout.n=8 不变
#
# Usage:
#   bash scripts/grpo/start_ruc_4gpu_80g.sh
#
# Architecture (Offload Mode):
#   GPU 0,1,2,3: Actor Model (Qwen3-4B 全参数) + Rollout Engine
#   Reward Models: Loaded to GPU temporarily during reward computation, then offloaded to CPU


hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ Experiment Configuration ============
# 【注意】验证流程说明：
# 当 test_freq > 0 时，每 N 步会执行一次完整验证，遍历整个验证集
# val_batch_size 决定每次处理的样本数，较小的值会导致更多循环迭代
# 如果验证集很大（如 1000+ 条），建议使用较大的 val_batch_size（如 32）
# 或者暂时禁用验证：test_freq: -1
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen3_4b_4gpu_80g_full
  total_epochs: 1
  total_training_steps: 500
  save_freq: 50
  test_freq: 50  # 【修复】降低验证频率，与 save_freq 同步
  val_before_train: false
  device: cuda
  log_freq: 10
  max_actor_ckpt_to_keep: 3
  default_local_dir: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/${trainer.project_name}/${trainer.experiment_name}
  n_gpus_per_node: 4
  nnodes: 1
  logger: ["swanlab","console"]

  rollout_data_dir: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/${trainer.experiment_name}/rollout_data
  validation_data_dir: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/${trainer.experiment_name}/validation_data

data:
  train_files: /home/u20240075/luoyashuo/data/cdad/cot_rewrite_max_fsf_v2/train.jsonl
  val_files: /home/u20240075/luoyashuo/data/cdad/cot_rewrite_max_fsf_v2/val_64.jsonl
  # 保持 train_batch_size=2, rollout.n=8 -> 每步 16 个 samples
  train_batch_size: 2
  val_batch_size: 8  # 【修复】增大验证 batch size，减少验证循环次数
  gen_batch_size: 8
  max_prompt_length: 5500
  max_response_length: 6700
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model
  prompt_key: problem
  apply_chat_template_kwargs:
    enable_thinking: false

  custom_cls:
    path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/utils/dataset/rl_dataset_jsonl.py
    name: RLHFDatasetJSONL

# ============ Actor/Rollout/Ref Configuration ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    path: /fs/fast/u20240075/hf_home/models/Qwen/Qwen3-4B
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    grad_clip: 1.0
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    # KL Loss 配置（推荐用于 GRPO，替代 use_kl_in_reward）
    use_kl_loss: true
    kl_loss_coef: 0.0001
    kl_loss_type: low_var_kl
    # FSDP 配置 - 开启 offload 释放显存给 Student vLLM
    fsdp_config:
      dtype: bfloat16
      # 【关键优化】开启 param_offload 和 optimizer_offload
      # 在 reward 计算时将 Actor 参数 offload 到 CPU，释放显存给 Student vLLM
      # 训练时会自动加载回 GPU，带来轻微性能损耗但避免 OOM
      # 【注意】param_offload 与 vLLM sleep 配合时可能导致死锁
      # 如果启用 param_offload，在验证/保存后 compute_log_prob 加载模型时可能卡住
      # 解决方案 1: 禁用 param_offload（当前设置，需要确保显存足够）
      # 解决方案 2: 保持 param_offload=true，但将 save_freq/test_freq 设得更大（如 200+）
      param_offload: false
      optimizer_offload: true  # 优化器状态 offload 可以安全启用
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: bf16

    optim:
      lr: 5e-6
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: -1

  rollout:
    name: vllm
    tensor_model_parallel_size: 4
    # 降低 Actor vLLM 显存占用，为 Student 留更多空间
    gpu_memory_utilization: 0.45  # 从 0.5 降到 0.45
    dtype: bfloat16
    log_prob_micro_batch_size_per_gpu: 1
    n: 8  # 保持 8 不变
    temperature: 1.0
    top_p: 0.95
    prompt_length: 5500
    response_length: 6700
    max_num_batched_tokens: 12288
    max_model_len: 12288
    enforce_eager: true
    free_cache_engine: true
    sleep_level: 1
    agent:
      num_workers: 1

  ref:
    enable: false
    log_prob_micro_batch_size_per_gpu: 1

# ============ Algorithm Configuration ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false  # 关闭 reward KL，改用 actor KL loss
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0  # 设为 0，因为 KL loss 在 actor 中控制             
  use_kl_loss: true
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
# ============ Critic Configuration (GRPO doesn't need) ============
critic:
  enable: false

# ============ Reward Model Configuration ============
reward_model:
  enable: false
  reward_manager: cot_rewriter
  offload_rollout_for_reward: true
  task_runner_num_gpus: 0

# ============ Custom Reward Function Configuration ============
custom_reward_function:
  path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/experimental/reward/cot_rewriter/combined_reward.py
  name: compute_cot_rewriter_reward
  reward_kwargs:
    student_model_path: /fs/fast/u20240075/hf_home/models/Qwen/Qwen3-1.7B
    fsf_model_path: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/fsf_judge/qwen3_8b_fsf_judge/checkpoint-12000
    device: cuda:1
    allow_cpu: true
    enable_offload: false
    offload_device: cpu
    lambda_logic: 0.5
    use_logic_reward: false
    alpha: 0.01
    print_samples: 2
    reward_backend: vllm
    
    # 【关键优化】Student vLLM 显存配置 (8000 token 长度)
    # 显存预算计算 (80GB GPU, 开启 Actor offload 后):
    #   - Actor vLLM sleep: ~36GB (gpu_memory_utilization=0.45)
    #   - FSDP 残留: ~5GB
    #   - 可用显存: ~75GB
    #   - Student vLLM 需要 (max_len=8000):
    #     - Model Weights (1.7B FP16): ~3.5GB (TP=4时每卡~1GB)
    #     - KV Cache (seq=8000, batch=2): ~4GB (TP=4时每卡~1GB)
    #     - logprobs 计算临时显存: ~20-30GB (主要是activation)
    #   - 安全计算: 需要 0.45-0.5 的显存利用率
    sglang_gpu_memory_utilization: 0.45  # 提高到 0.45 以支持 8000 长度
    vllm_gpu_memory_utilization: 0.45    # 提高到 0.45 以支持 8000 长度
    
    # Student vLLM 最大序列长度 = 8000 (用户要求)
    student_max_model_len: 8000
    # 【关键优化】降低 micro_batch_size 避免 OOM
    # 8000 token 长度下，batch=8 会导致 KV Cache ~15GB+，容易 OOM
    # 降到 2 可以大幅减少 KV Cache 占用 (~4GB)
    student_micro_batch_size: 2
    # 【Tensor Parallelism 配置】
    # TP=1: 4 个独立 vLLM actor，每个 1 GPU（吞吐量高）
    # TP=2: 2 个 vLLM actor，每个 2 GPU（显存减半）
    # TP=4: 1 个 vLLM actor，4 GPU（显存最省，最保险）
    student_tensor_parallel_size: 4
    student_devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
    cleanup_after_compute: true
    truncation_penalty: -1.0
    field_mapping:
      prompt_key: problem
      reward_model_key: reward_model
      question_key: question
      original_cot_key: original_cot
      ground_truth_key: ground_truth

# ============ Reward Manager Configuration ============
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/experimental/reward/cot_rewriter/reward_manager.py

# ============ Ray Configuration ============
ray_init:
  num_cpus: null
  timeline_json_file: null
