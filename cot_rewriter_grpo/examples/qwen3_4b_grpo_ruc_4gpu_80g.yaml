# CoT Rewriter GRPO Training Configuration
# Hardware: 4 x 80GB A100/H100 GPUs
# Model: Qwen3-4B Full Parameter Training (无 LoRA)
#
# Usage:
#   bash scripts/grpo/start_4gpu_80g.sh
#
# Architecture (Offload Mode):
#   GPU 0,1,2,3: Actor Model (Qwen3-4B 全参数) + Rollout Engine
#   Reward Models: Loaded to GPU temporarily during reward computation, then offloaded to CPU
#
# 80G 显存优化:
#   - 全参数训练 (无 LoRA)
#   - 更大的 batch size: 8 (vs 2 on 40G)
#   - 更长的序列长度: max_model_len=16384

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============ Experiment Configuration ============
trainer:
  project_name: cot_rewriter_grpo
  experiment_name: qwen3_4b_4gpu_80g
  total_epochs: 1
  total_training_steps: 500  # Limit total steps for faster iteration
  save_freq: 50  # Save checkpoint every 50 steps
  test_freq: 50  # Validation frequency (verl uses test_freq, not val_freq)
  val_before_train: false  # Skip validation before training to speed up startup
  device: cuda
  log_freq: 10
  max_actor_ckpt_to_keep: 3
  # Output directory
  default_local_dir: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/rewrite/qwen3_4b_grpo_4gpu_80g/${trainer.project_name}/${trainer.experiment_name}
  # 4 GPUs for training
  n_gpus_per_node: 4
  nnodes: 1
  logger: ["swanlab","console"]

  # Rollout data logging
  rollout_data_dir: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/rewrite/qwen3_4b_grpo_4gpu_80g/rollout_data
  validation_data_dir: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/rewrite/qwen3_4b_grpo_4gpu_80g/validation_data

data:
  train_files: /home/u20240075/luoyashuo/data/cdad/cot_rewrite_max_fsf_v2/train.jsonl
  val_files: /home/u20240075/luoyashuo/data/cdad/cot_rewrite_max_fsf_v2/val.jsonl
  # IMPORTANT: total samples = train_batch_size × rollout.n must be divisible by n_gpus_per_node
  # 快速验证配置: 2 × 2 = 4, 4 × 4 GPUs = 16 samples
  # 正式训练时改回: train_batch_size=4, rollout.n=8
  train_batch_size: 2  # 快速验证，正式训练改回 4
  val_batch_size: 4
  gen_batch_size: 8
  max_prompt_length: 5500
  max_response_length: 4500
  return_raw_chat: true
  dataloader_num_workers: 4
  reward_fn_key: reward_model
  prompt_key: problem
  apply_chat_template_kwargs:
    enable_thinking: false

  custom_cls:
    path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/utils/dataset/rl_dataset_jsonl.py
    name: RLHFDatasetJSONL

# ============ Actor/Rollout/Ref Configuration ============
actor_rollout_ref:
  hybrid_engine: true

  model:
    path: /fs/fast/u20240075/hf_home/models/Qwen/Qwen3-4B
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    # Full parameter training (no LoRA)

  actor:
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.01
    grad_clip: 1.0
    ppo_mini_batch_size: 1  # 减小以避免 backward OOM
    # 降低 micro batch size 以减少显存峰值
    ppo_micro_batch_size_per_gpu: 1
    # FSDP 配置 - 使用 fp16 避免旧驱动的 bfloat16 转换问题
    fsdp_config:
      dtype: float16
      param_offload: true      # 在 reward 计算时 offload 参数到 CPU
      optimizer_offload: true  # 在 reward 计算时 offload optimizer 到 CPU
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp16

    optim:
      lr: 1e-5
      weight_decay: 0.01
      lr_scheduler_type: cosine
      lr_warmup_steps_ratio: 0.03
      min_lr_ratio: 0.1
      total_training_steps: -1

  rollout:
    # 使用 vLLM 引擎
    # 如需切换到 SGLang，改为 name: sglang
    name: vllm
    tensor_model_parallel_size: 1
    # vLLM 显存占用 - Actor vLLM 通过 sleep(level=2) 完全释放后
    # Student vLLM 可以使用全部 GPU 显存，计算完后 cleanup 再 reload Actor vLLM
    gpu_memory_utilization: 0.7
    dtype: float16
    # 降低 log_prob 计算时的 micro batch size
    log_prob_micro_batch_size_per_gpu: 1
    n: 4  # 快速验证 (需要满足 ppo_mini_batch_size * n >= n_gpus)，正式训练改回 8
    temperature: 0.7
    top_p: 0.95
    prompt_length: 4500
    response_length: 5500
    # max_model_len = 8192 + 8192 = 16384
    max_num_batched_tokens: 10240
    max_model_len: 10240
    # 禁用 CUDA Graph 以避免旧驱动兼容性问题
    enforce_eager: true
    # 启用 vLLM 销毁/重建机制 - 在 reward 计算时销毁 vLLM 释放显存给 Student vLLM
    # 我们已修改代码来正确重置 vLLM cumem allocator，避免重建失败
    free_cache_engine: true
    # sleep_level=2: 完全释放 GPU 显存（丢弃权重+KV cache），wake_up 时从磁盘重新加载
    # sleep_level=1: 只 offload 到 CPU（需要足够 CPU 内存）
    sleep_level: 2
    agent:
      num_workers: 1

  ref:
    enable: false

# ============ Algorithm Configuration ============
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false

# ============ Critic Configuration (GRPO doesn't need) ============
critic:
  enable: false

# ============ Reward Model Configuration ============
reward_model:
  enable: false
  reward_manager: cot_rewriter
  # 启用 offload - 在 reward 计算前：
  # 1. 销毁 Actor vLLM (free_cache_engine=true)
  # 2. Offload Actor 模型到 CPU
  # 这样释放足够显存给 Student vLLM 计算 reward
  offload_rollout_for_reward: true
  task_runner_num_gpus: 0

# ============ Custom Reward Function Configuration ============
custom_reward_function:
  path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/experimental/reward/cot_rewriter/combined_reward.py
  name: compute_cot_rewriter_reward
  reward_kwargs:
    student_model_path: /fs/fast/u20240075/hf_home/models/Qwen/Qwen3-1.7B
    fsf_model_path: /fs/fast/u20240075/luoyashuo/checkpoints/cdad/fsf_judge/qwen3_8b_fsf_judge/checkpoint-12000
    device: cuda:1
    allow_cpu: true
    enable_offload: false
    offload_device: cpu
    lambda_logic: 0.5
    use_logic_reward: false
    alpha: 0.01
    print_samples: 2
    # Reward 后端选择: sglang 或 vllm
    # sglang: 使用 SGLang Engine 计算 Student reward 和 FSF Judge
    # vllm: 使用 vLLM 计算 Student reward，HuggingFace 计算 FSF Judge
    reward_backend: vllm  # 先用 vllm 验证
    # SGLang/vLLM 配置
    # Student Model (1.7B) 在每个 GPU 上都启动一个实例进行并行计算
    # Actor 引擎已通过 sleep 机制完全释放 GPU 显存
    #
    # 显存预算计算 (80GB GPU):
    #   - vLLM sleep 后释放: ~55GB
    #   - FSDP 残留 (metadata, buffers, CUDA context): ~10-15GB
    #   - 可用显存: ~65-70GB
    #   - Student vLLM 需要:
    #     - Model Weights (1.7B FP16): ~3.5GB
    #     - KV Cache: gpu_memory_utilization * 80GB
    #     - logprobs 计算临时显存: ~10GB
    #   - 安全计算: (65 - 3.5 - 10) / 80 ≈ 0.4
    #
    # 设置 0.4 确保 Student vLLM + logprobs 计算不会 OOM
    # 如果仍然 OOM，可以进一步降到 0.35
    sglang_gpu_memory_utilization: 0.4  # SGLang 后端使用
    vllm_gpu_memory_utilization: 0.4    # vLLM 后端使用 (从 0.5 降到 0.4 避免 OOM)
    # 在所有 4 个 GPU 上启动 Student vLLM，实现数据并行
    # 每个 GPU 一个 Student vLLM 实例，计算完成后自动 cleanup 释放显存
    student_devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
    # 计算完成后清理 Student vLLM 以释放 GPU 显存给 Actor vLLM 重载
    cleanup_after_compute: true
    # GPU batch size for forward pass (仅当 use_multi_gpu=true 时生效)
    gpu_batch_size: 1
    # 截断惩罚：被截断的 response 直接返回此 reward，不调用 Student model
    # 截断检测：response 未以 EOS 结尾或达到 max_response_length
    truncation_penalty: -1.0
    field_mapping:
      prompt_key: problem
      reward_model_key: reward_model
      question_key: question
      original_cot_key: original_cot
      ground_truth_key: ground_truth

# ============ Reward Manager Configuration ============
reward_manager:
  source: importlib
  name: CoTRewriterRewardManager
  module:
    path: /home/u20240075/luoyashuo/projects/cdad/cot_rewriter_grpo/verl/verl/experimental/reward/cot_rewriter/reward_manager.py

# ============ Ray Configuration ============
# verl 0.5.0 expects ray_init at top level, not under ray_kwargs
ray_init:
  num_cpus: null
  timeline_json_file: null
