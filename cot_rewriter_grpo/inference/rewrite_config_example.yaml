# =============================================================================
# 数据集改写配置
# =============================================================================
# 功能说明：
#   使用训练好的 CoT Rewriter 模型对原始数据集进行改写，通过多级过滤
#   筛选出高质量的改写结果，生成新的训练数据集。
#
# 新流程（指标计算与过滤分离）：
#   Step 1: 模型格式转换 (FSDP -> HF)
#   Step 2: 数据加载 + Prompt 构建
#   Step 3: 改写生成 (每个样本生成 n_rewrites 次改写)
#   Step 4: 计算相似度指标 (不过滤)
#   Step 5: 计算 CoT Effect Ratio 指标 (不过滤)
#   Step 6: 计算 FSF 指标 (不过滤)
#   Step 7: 应用过滤规则 (基于阈值，可单独运行调整阈值)
#   Step 8: 选择最优结果或回退原文 -> 生成新数据集
#
# 关键改进：
#   - 指标计算完成后保存，可重复使用
#   - 调整过滤阈值时无需重新加载模型计算指标
# =============================================================================

# -----------------------------------------------------------------------------
# 模型路径配置
# -----------------------------------------------------------------------------
# 改写模型路径 (FSDP checkpoint 目录，需包含 global_step_XXX)
rewrite_model_path: /data/luoys/checkpoints/cdad/cot_rewriter_grpo/llama3_8b_grpo_8x80g_top2000_v4/global_step_160

# Student Model (用于计算 CoT Effect Ratio，使用 SGLang 推理)
student_model_path: /data/luoys/modelscope_cache/models/Qwen/Qwen3-4B

# FSF Judge Model (用于计算失败步骤比例，使用 SGLang 推理)
fsf_judge_model_path: /data/luoys/modelscope_cache/models/Qwen/Qwen3-4B

# -----------------------------------------------------------------------------
# 数据路径配置
# -----------------------------------------------------------------------------
# 输入数据路径 (JSONL 格式，需包含 conversations 字段)
input_data_path: /data/luoys/data/cdad/omnithought_rv_optimal_top2000/train_160.jsonl

# 输出目录 (生成的数据和中间结果将保存在此目录)
output_dir: /data/luoys/data/cdad/rewritten_output/llama3_8b_grpo_8x80g_top2000_v4_iter160_test

# -----------------------------------------------------------------------------
# 改写参数
# -----------------------------------------------------------------------------
# 每个样本生成的改写次数 (更多次数 = 更大几率找到好的改写，但速度更慢)
n_rewrites: 1

# -----------------------------------------------------------------------------
# 过滤阈值参数 (用于 Step 7: 应用过滤规则)
# -----------------------------------------------------------------------------
# 相似度过滤
#   - 范围: [0, 1]，值越低过滤越严格
#   - 含义: 改写与原文的字符级相似度，高于此值的改写会被丢弃
similarity_penalty_threshold: 0.5
enable_similarity_filter: true   # 是否启用相似度过滤

# CoT Effect Ratio 过滤
#   - 范围: [0, inf)，1.0 表示和原文一样好
#   - 含义: cot_effect_ratio = cot_effect(rewrite) / cot_effect(original)
#           cot_effect(cot) = avg_prob(Q,CoT,A) - avg_prob(Q,A)
cot_effect_ratio_threshold: 0.85
enable_cot_effect_filter: true   # 是否启用 CoT Effect 过滤

# CoT Effect Ratio 计算上限
#   - 用于裁剪极端值，避免个别样本影响整体
cot_effect_ratio_ceiling: 999

# FSF 过滤
#   - 新逻辑: 只保留 fsf_rewrite < fsf_original 的改写
#   - 即改写的失败步骤比例必须比原文更低
fsf_threshold: 0.0              # 保留此字段用于兼容，但实际不使用
fsf_use_relative: true          # 是否使用相对比较 (fsf_rewrite < fsf_original)
enable_fsf_filter: true         # 是否启用 FSF 过滤

# -----------------------------------------------------------------------------
# 改写模型生成参数 (用于 vLLM)
# -----------------------------------------------------------------------------
max_new_tokens: 15000      # 最大生成长度
temperature: 1.0           # 采样温度 (越高越随机，0.6-0.8 推荐)
top_p: 0.95                # nucleus sampling 参数
top_k: -1                  # top-k sampling 参数 (-1 表示不使用)
presence_penalty: 0.0      # 存在惩罚 (0.0 = 关闭)
frequency_penalty: 0.0     # 频率惩罚 (0.0 = 关闭)

# -----------------------------------------------------------------------------
# 批处理参数
# -----------------------------------------------------------------------------
num_workers: 8             # 并行 worker 数量（用于相似度计算）
process_batch_size: 8     # 每处理这么多样本后保存一次 ckpt

# -----------------------------------------------------------------------------
# Ray + vLLM 推理参数 (用于改写模型 rewrite_model_path)
# -----------------------------------------------------------------------------
# Tensor Parallelism 大小 (每个 Ray Actor 的张量并行大小)
#   - TP=1: 单卡推理 (适合小模型或大量GPU)
#   - TP=2: 每个 Actor 用2张卡 (推荐，平衡显存和通讯)
#   - TP>2: 大模型需要
#   - 8B模型: 建议 TP=2
#   - Actor 数量会自动计算 = total_gpus / vllm_tensor_parallel_size
#     例如：8张卡，TP=2 → 自动创建 4 个 Ray Actor 并行
vllm_tensor_parallel_size: 1

# GPU 显存利用率
#   - 范围: [0, 1]
#   - 建议: 0.85-0.90
#   - 如遇 OOM，减小此值
vllm_gpu_memory_utilization: 0.85

# Micro Batch 大小 (每个 Actor 每次处理的任务数)
#   - 越大速度越快，但显存占用越高
#   - 8B模型 + 80GB显存: 建议 2
#   - 8B模型 + 40GB显存: 建议 1
#   - 如遇 OOM，减小此值
vllm_micro_batch_size: 1

# -----------------------------------------------------------------------------
# SGLang 推理参数 (用于 student 和 fsf judge 模型)
# -----------------------------------------------------------------------------
# Tensor Parallelism 大小
#   - TP=1: 每个GPU运行独立的SGLang实例 (数据并行，推荐)
#   - TP>1: 多个GPU共享一个SGLang实例 (张量并行)
#   - 4B模型: 建议 TP=1 (数据并行效率更高)
sglang_tensor_parallel_size: 1

# Micro Batch 大小 (控制显存使用)
#   - 越大速度越快，但显存占用越高
#   - 如遇 OOM，减小此值 (8, 4, 2, 1)
sglang_micro_batch_size: 1

# -----------------------------------------------------------------------------
# 调试选项 (跳过某些步骤)
# -----------------------------------------------------------------------------
# 跳过指标计算步骤 (如果已有指标文件)
skip_rewrite: false           # 跳过改写生成 (直接使用已有的 ckpt_1)
skip_similarity_compute: false # 跳过相似度指标计算
skip_ppl_compute: false        # 跳过 CoT Effect Ratio 指标计算
skip_fsf_compute: false        # 跳过 FSF 指标计算

# 兼容旧配置
skip_similarity: false
skip_ppl: false
skip_fsf: false
