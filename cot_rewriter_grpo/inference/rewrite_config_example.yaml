# 数据集改写配置示例

# 模型路径
rewrite_model_path: /data/luoys/checkpoints/cdad/cot_rewriter_grpo/llama3_8b_grpo_8x80g_v8/global_step_100
student_model_path: /data/luoys/modelscope_cache/models/Qwen/Qwen3-4B
fsf_judge_model_path: /data/luoys/modelscope_cache/models/Qwen/Qwen3-4B

# 数据路径
input_data_path: /data/luoys/data/cdad/omnithought_rv_optimal/train.jsonl
output_dir: /data/luoys/data/cdad/rewritten_output/llama3_8b_grpo_8x80g_v8_s100

# 改写参数
n_rewrites: 1  # 每个样本调用n次改写模型

# 阈值参数
similarity_penalty_threshold: 0.9  # 相似度高于此值则丢弃
ppl_relative_improvement_threshold: 0.0  # PPL相对改进率低于此值则丢弃
fsf_threshold: 0.0  # FSF高于此值则丢弃

# 模型生成参数
max_new_tokens: 15000
temperature: 0.6
top_p: 0.95
presence_penalty: 1.2
frequency_penalty: 1.2

# 多进程参数
num_workers: 8
batch_size: 32

# SGLang参数
# sglang_tensor_parallel_size: Tensor Parallelism大小
# - 对于7B/8B模型，TP=1即可（单卡推理足够快）
# - 对于更大模型（如70B），可能需要TP=4或TP=8
# - 注意：TP越大，显存占用越少，但通信开销会增加
sglang_tensor_parallel_size: 4

# sgland_micro_batch_size: micro batch大小，控制显存使用
# - 越大速度越快，但显存占用越高
# - 如果遇到OOM，可以减小此值
sgland_micro_batch_size: 8

# 可选：跳过某些步骤（用于调试）
skip_rewrite: false
skip_similarity: false
skip_ppl: false
skip_fsf: false
