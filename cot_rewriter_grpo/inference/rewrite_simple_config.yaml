# =============================================================================
# 简化版数据集改写配置
# =============================================================================
# 功能说明：
#   使用训练好的 CoT Rewriter 模型对原始数据集进行改写，自动打乱结果，
#   生成新的训练数据集。
#
# 流程：
#   Step 1: 模型格式转换 (FSDP -> HF)
#   Step 2: 数据加载 + Prompt 构建
#   Step 3: 改写生成 (每个样本生成 n_rewrites 次改写)
#   Step 4: 自动打乱改写结果，随机选择一个
#   Step 5: 生成训练集格式
# =============================================================================

# -----------------------------------------------------------------------------
# 模型路径配置
# -----------------------------------------------------------------------------
# 改写模型路径 (FSDP checkpoint 目录)
rewrite_model_path: /data/luoys/checkpoints/cdad/cot_rewriter_grpo/llama3_3b_grpo_8x80g_top2000/global_step_180

# -----------------------------------------------------------------------------
# 数据路径配置
# -----------------------------------------------------------------------------
# 输入数据路径 (JSONL 格式，需包含 conversations 字段)
input_data_path: /data/luoys/data/cdad/omnithought_rv_optimal_top50k/train.jsonl

# 输出目录
output_dir: /data/luoys/data/cdad/rewritten_output/llama3_3b_grpo_8x80g_top50k_iter180_train

# -----------------------------------------------------------------------------
# 改写参数
# -----------------------------------------------------------------------------
# 每个样本生成的改写次数
n_rewrites: 1

# 是否打乱改写结果 (随机选择一个)
shuffle_rewrites: true

# 随机种子 (用于可复现性)
random_seed: 42

# -----------------------------------------------------------------------------
# 改写模型生成参数 (vLLM)
# -----------------------------------------------------------------------------
max_new_tokens: 15000      # 最大生成长度
temperature: 0.6           # 采样温度
top_p: 0.95                # nucleus sampling
top_k: -1                  # top-k sampling (-1 = 不使用)
presence_penalty: 0.0      # 存在惩罚
frequency_penalty: 0.0     # 频率惩罚

# -----------------------------------------------------------------------------
# 批处理参数
# -----------------------------------------------------------------------------
process_batch_size: 32     # 每处理这么多样本后保存一次 ckpt

# -----------------------------------------------------------------------------
# Ray + vLLM 推理参数
# -----------------------------------------------------------------------------
# Tensor Parallelism 大小 (每个 Ray Actor 的张量并行大小)
# Actor 数量会自动计算 = total_gpus / vllm_tensor_parallel_size
vllm_tensor_parallel_size: 1

# GPU 显存利用率
vllm_gpu_memory_utilization: 0.85

# Micro Batch 大小 (每个 Actor 每次处理的任务数)
vllm_micro_batch_size: 1
