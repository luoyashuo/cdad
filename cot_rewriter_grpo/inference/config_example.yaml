# CoT Rewrite Inference Pipeline - Full Configuration Example
# Copy this file and edit the paths/parameters for your experiment.

# Basic configuration
experiment_name: "cot_rewrite_exp1"
output_root: "/data/output/cot_rewrite"
resume: true   # Auto-resume from last checkpoint on restart
seed: 42

# Model configuration
model:
  checkpoint_path: "/data/cdad/checkpoints/global_step_40"
  # Format detection: auto / hf / lora / fsdp / megatron
  # auto: detects based on directory structure
  format: "auto"
  merge_lora: true       # Merge LoRA weights if format=lora
  dtype: "bfloat16"
  max_model_len: 8192

# Rollout configuration (Step 2)
rollout:
  input_data: "/data/hf_home/datasets/train.jsonl"  # ShareGPT format JSONL
  num_rollouts: 4          # Number of rewrites per sample
  batch_size: 32           # vLLM generation batch size per worker

  generation:
    temperature: 0.7
    top_p: 0.9
    max_new_tokens: 4096

  parallel:
    # gpu_ids: auto-detected if not specified
    # gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    tensor_parallel_size: 1   # GPUs per vLLM instance (DP = total_gpus / tp_size)

# Correct Judge configuration (Step 3)
correct_judge:
  model_path: "/data/luoys/modelscope_cache/models/Qwen/Qwen3-4B"
  enabled: true
  batch_size: 8            # Micro-batch size per worker
  tensor_parallel_size: 1
  mem_fraction_static: 0.4
  dtype: "float16"
  max_model_len: 8192
  # gpu_ids: auto-detected if not specified
  # gpu_ids: [0, 1, 2, 3]

  generation:
    temperature: 0.0       # Deterministic for judgment
    max_new_tokens: 50     # Short output: <judge>Yes/No</judge>

# FSF Judge configuration (Step 4)
fsf_judge:
  model_path: "/data/luoys/modelscope_cache/models/Qwen/Qwen3-4B"
  enabled: true
  batch_size: 4            # Micro-batch size per worker
  tensor_parallel_size: 1
  mem_fraction_static: 0.4
  dtype: "float16"
  max_model_len: 8192
  # gpu_ids: auto-detected if not specified
  # gpu_ids: [0, 1, 2, 3]

  generation:
    temperature: 0.6
    max_new_tokens: 8000

# Dataset build configuration (Step 5)
dataset_build:
  filters:
    fsf_positive: true      # Only keep rewrites with FSF > 0
    correct_only: true      # Only keep rewrites where is_correct=True

  # Selection strategy: random / max_fsf / priority_correct
  selection_strategy: "priority_correct"

  # Output filename (relative to {output_root}/{experiment_name}/final/)
  output_filename: "train_sharegpt.jsonl"
